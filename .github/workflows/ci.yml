name: C17 foundation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Full governance and engineering quality
        run: python tools/quality.py
      - name: CMake alternate build
        run: |
          python -m pip install cmake==3.31.10 ninja==1.13.2
          if ($LASTEXITCODE -ne 0) { throw 'CMake tools install failed' }
          cmake -S . -B build/cmake -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build build/cmake
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed' }
          ctest --test-dir build/cmake --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'CTest failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-windows
          path: |
            build/**/build-manifest.json
            build/**/test-report.json
            build/quality/**
            build/cmake/Testing/Temporary/LastTest.log
