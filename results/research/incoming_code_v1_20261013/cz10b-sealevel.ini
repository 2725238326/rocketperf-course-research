# ============================================================
# 长征十号乙（首飞）一级动力系统算例 —— 单台 YF-100K
# 循环方式：高压补燃（富氧分级燃烧）循环 -> staged_combustion=true
# 说明：本算例是"声明热状态"计账模型，不是绝热完整循环。
#       预燃室排气经涡轮后回流入主室，全部流量从主喷管排出。
#       每一个数值的口径与来源见  model-data/cz10b-yf100k.md
# ============================================================
schema_version=1
case_id=cz10b_yf100k_staged
case_kind=research_scenario
source_ref=CZ-10B single YF-100K staged-combustion cycle, declared research inputs
model=prescribed_thermal_cycle_v1
staged_combustion=true

# ---- 流量与推进剂（公开：混合比 2.6）----
total_mass_flow_kg_per_s=400
overall_oxidizer_fuel_ratio=2.6

# ---- 燃料泵：密度取 RP-1 公开典型值 810；入口焓取 NASA9 生成焓基准 ----
fuel_pump_density_kg_per_m3=810
fuel_pump_inlet_pressure_pa=300000
fuel_pump_outlet_pressure_pa=32000000
fuel_pump_efficiency=0.7
fuel_pump_inlet_h_j_per_kg=-4650000

# ---- 氧化剂泵：密度取液氧典型值；入口焓取元素基准 0 ----
oxidizer_pump_density_kg_per_m3=1141
oxidizer_pump_inlet_pressure_pa=300000
oxidizer_pump_outlet_pressure_pa=32000000
oxidizer_pump_efficiency=0.75
oxidizer_pump_inlet_h_j_per_kg=0

# ---- 主燃烧室（公开：室压 18.7 MPa；室温取同工况平衡值 3448.01 K）----
chamber_pressure_pa=18700000
chamber_temperature_k=3448.0062630027533
main_area_ratio=35

# ---- 预燃室/涡轮（模型气相平衡域 O/F 上限 20，真机富氧预燃室高于此）----
generator_oxidizer_fuel_ratio=20
generator_temperature_k=1200

# ---- 涡轮与轴系（声明值：预燃室 30 MPa，涡轮背压 20 MPa 高于室压）----
turbine_inlet_pressure_pa=30000000
turbine_outlet_pressure_pa=20000000
turbine_efficiency=0.7
shaft_efficiency=0.95
auxiliary_power_w=10000
maximum_branch_fraction=0.9

# ---- 补燃回流（staged：涡轮排气经回流管注入主室，回流压降 0.5 MPa）----
# 注意：return_fraction 由 staged_combustion 开关驱动，文件里必须保持 0。
return_fraction=0
return_pressure_drop_pa=500000
branch_area_ratio=1
branch_axial_projection=0

# ---- 背压：0 = 真空工况 ----
ambient_pressure_pa=101325
