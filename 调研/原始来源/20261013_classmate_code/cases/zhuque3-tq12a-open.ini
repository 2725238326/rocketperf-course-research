# ============================================================
# 朱雀三号（基础型 / 遥一）一级动力系统算例 —— 单台天鹊-12A
# 循环方式：燃气发生器循环（开式）-> staged_combustion=false
# 说明：本算例是"声明热状态"计账模型，不是绝热完整循环。
#       每一个数值的口径与来源见  model-data/zhuque3-tq12a.md
# ============================================================
schema_version=1
case_id=zhuque3_tq12a_open
case_kind=research_scenario
source_ref=Zhuque-3 Y1 single TQ-12A open gas-generator cycle, declared research inputs
model=prescribed_thermal_cycle_v1
staged_combustion=false

# ---- 流量与推进剂（公开：混合比 2.9）----
total_mass_flow_kg_per_s=233.24
overall_oxidizer_fuel_ratio=2.9

# ---- 燃料泵：密度取程序 CoolProp 液态表 @120K,10MPa；入口焓取 NASA9 生成焓基准 ----
fuel_pump_density_kg_per_m3=419.79379962384246
fuel_pump_inlet_pressure_pa=300000
fuel_pump_outlet_pressure_pa=12000000
fuel_pump_efficiency=0.7
fuel_pump_inlet_h_j_per_kg=-4650000

# ---- 氧化剂泵：密度取程序液态表 @100K,10MPa；入口焓取元素基准 0 ----
oxidizer_pump_density_kg_per_m3=1116.2865359646898
oxidizer_pump_inlet_pressure_pa=300000
oxidizer_pump_outlet_pressure_pa=12000000
oxidizer_pump_efficiency=0.75
oxidizer_pump_inlet_h_j_per_kg=0

# ---- 主燃烧室（公开：室压 10.1 MPa；室温取同工况 CH4/O2 平衡值 3566.29 K）----
chamber_pressure_pa=10100000
chamber_temperature_k=3566.2854709662497
main_area_ratio=40

# ---- 燃气发生器（模型气相平衡域 O/F 0.1..20；富燃取 1.0）----
generator_oxidizer_fuel_ratio=1.0
generator_temperature_k=1800

# ---- 涡轮与轴系（声明值：发生器压力 12 MPa，涡轮背压 1.0 MPa）----
turbine_inlet_pressure_pa=12000000
turbine_outlet_pressure_pa=1000000
turbine_efficiency=0.7
shaft_efficiency=0.95
auxiliary_power_w=10000
maximum_branch_fraction=0.25

# ---- 外排支路（开式循环：涡轮排气经支路喷管排入大气）----
return_fraction=0
return_pressure_drop_pa=0
branch_area_ratio=2
branch_axial_projection=1

# ---- 背压：0 = 真空工况 ----
ambient_pressure_pa=0
