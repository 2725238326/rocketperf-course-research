<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="work2-business-title work2-business-desc"><title id="work2-business-title">作业二业务架构</title><desc id="work2-business-desc">五项目标业务能力：对象证据、场景模型、C计算、实验评估、结论交付。协议事前定义，参考在开发侧核验，任务与版本治理共同支撑；并非已实现功能清单。</desc><defs><marker id="work2-business-arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4.5 L0,9 Z" fill="#55606e"/></marker></defs><g font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif"><rect width="1600" height="1050" fill="#ffffff"/><text x="64" y="60" font-size="32" fill="#16212e" font-weight="700" text-anchor="start">作业二业务架构</text><text x="64" y="96" font-size="18" fill="#6e7a88" font-weight="400" text-anchor="start">从研究问题到可复核结论 · 目标职责设计，不代表各项能力已实现</text><line x1="64" y1="118" x2="1536" y2="118" stroke="#d5dbe3" stroke-width="1"/><rect x="64" y="144" width="1472" height="68" rx="8" fill="#eef2f7" stroke="none" stroke-width="1.2"/><text x="88" y="173" font-size="17" fill="#1f3a5f" font-weight="700" text-anchor="start">业务目标</text><text x="202" y="173" font-size="19" fill="#16212e" font-weight="400" text-anchor="start">以有来源的输入与明确模型，用 C 计算热力性能，解释差异、可信范围与改进价值。</text><text x="202" y="197" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">两型研究关联级段、子型和批次；同一计算引擎同时服务方法基准、条件研究与算法实验。</text><rect x="64" y="260" width="416" height="184" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M64,266 a6,6 0 0 1 6,-6 h404 a6,6 0 0 1 6,6 v34 h-416 Z" fill="#1f3a5f"/><text x="82" y="287.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">01 对象与证据</text><text x="82" y="332" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">对象 / 子型 / 批次 / 工况</text><text x="82" y="360" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">原文观察、单位、冲突与未知</text><text x="82" y="388" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">输出：可引用的参数与缺口</text><rect x="592" y="260" width="416" height="184" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M592,266 a6,6 0 0 1 6,-6 h404 a6,6 0 0 1 6,6 v34 h-416 Z" fill="#1f3a5f"/><text x="610" y="287.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">02 场景与模型</text><text x="610" y="332" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">研究问题、完整输入与显式假设</text><text x="610" y="360" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">物种 / 相态 / 入口 / 膨胀边界</text><text x="610" y="388" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">输出：可执行的场景与模型版本</text><rect x="1120" y="260" width="416" height="184" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M1120,266 a6,6 0 0 1 6,-6 h404 a6,6 0 0 1 6,6 v34 h-416 Z" fill="#1d6f6a"/><text x="1138" y="287.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">03 C 计算</text><text x="1138" y="332" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">入口、TP / HP、喷管及可选循环</text><text x="1138" y="360" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">按用例组合；数值策略显式选择</text><text x="1138" y="388" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">输出：原始结果、状态与诊断</text><polyline points="480,352 592,352" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#work2-business-arrow)"/><text x="536" y="332" font-size="14" fill="#3a4654" font-weight="400" text-anchor="middle">观察及缺口</text><polyline points="1008,352 1120,352" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#work2-business-arrow)"/><text x="1064" y="332" font-size="14" fill="#3a4654" font-weight="400" text-anchor="middle">输入快照</text><rect x="64" y="480" width="944" height="54" rx="8" fill="#f8f1e7" stroke="none" stroke-width="1.2"/><text x="84" y="513" font-size="19" fill="#a8641a" font-weight="600" text-anchor="start">事前实验协议：比较类型、工况、参考、判据、失败分母与总成本</text><polyline points="720,534 720,588" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#work2-business-arrow)"/><polyline points="1504,444 1504,558 880,558 880,588" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#work2-business-arrow)"/><text x="1328" y="487" font-size="16" fill="#1d6f6a" font-weight="400" text-anchor="middle">每次尝试均保留</text><text x="1328" y="514" font-size="16" fill="#3a4654" font-weight="400" text-anchor="middle">成功与失败进入同一评估</text><rect x="64" y="588" width="416" height="190" rx="6" fill="#ffffff" stroke="#4a5868" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M64,594 a6,6 0 0 1 6,-6 h404 a6,6 0 0 1 6,6 v34 h-416 Z" fill="#4a5868"/><text x="82" y="615.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">参考与独立检查</text><text x="82" y="660" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">固定版本参考、解析关系与残差</text><text x="82" y="688" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">参考输出同样需要适用性检查</text><text x="82" y="716" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">开发侧使用；生产依赖单独核对</text><rect x="592" y="588" width="416" height="190" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M592,594 a6,6 0 0 1 6,-6 h404 a6,6 0 0 1 6,6 v34 h-416 Z" fill="#a8641a"/><text x="610" y="615.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">04 实验与评估</text><text x="610" y="660" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">准确度、可靠性、成本与适用域</text><text x="610" y="688" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">实现误差 / 模型差异 / 输入影响</text><text x="610" y="716" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">输出：带条件与证据的评估</text><rect x="1120" y="588" width="416" height="190" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M1120,594 a6,6 0 0 1 6,-6 h404 a6,6 0 0 1 6,6 v34 h-416 Z" fill="#1d6f6a"/><text x="1138" y="615.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">05 结论与交付</text><text x="1138" y="660" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">回答问题，说明收益、反例和局限</text><text x="1138" y="688" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">图表 / 报告 / PPT 与源码 / 程序</text><text x="1138" y="716" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">输出：可追溯结论与冻结材料</text><polyline points="480,683 592,683" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#work2-business-arrow)" stroke-dasharray="6 4"/><text x="536" y="662" font-size="14" fill="#4a5868" font-weight="400" text-anchor="middle">参考证据</text><polyline points="1008,683 1120,683" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#work2-business-arrow)"/><text x="1064" y="662" font-size="14" fill="#1d6f6a" font-weight="400" text-anchor="middle">有条件结论</text><text x="64" y="819" font-size="18" fill="#3a4654" font-weight="400" text-anchor="start">评估发现问题 → 回到来源、场景或算法，新增版本并保留原运行记录。</text><text x="64" y="851" font-size="18" fill="#3a4654" font-weight="400" text-anchor="start">结果接收分别检查：执行与求解状态、物理残差和参考差异、目标对象适用性。</text><rect x="64" y="888" width="1472" height="88" rx="8" fill="#f2f4f6" stroke="#d5dbe3" stroke-width="1.2"/><text x="88" y="920" font-size="18" fill="#4a5868" font-weight="700" text-anchor="start">共同支撑</text><text x="222" y="920" font-size="19" fill="#16212e" font-weight="400" text-anchor="start">唯一任务登记 · 版本与原件保护 · 统一质量 · 真实分工与知识掌握</text><text x="222" y="951" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">场景 / 物理模型 / 数值策略 / 执行配置分别留身份；AI作为候选策略，与传统方法共用接收门槛。</text><text x="64" y="1018" font-size="16" fill="#6e7a88" font-weight="400" text-anchor="start">边界：离线研究与 Windows C 程序；独立用例可直接求 TP、HP 或喷管，不要求每次都走完整循环。</text></g></svg>
