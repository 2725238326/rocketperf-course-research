<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="770" viewBox="0 0 1680 770" role="img" aria-labelledby="title-03 desc-03"><title id="title-03">任务流程：执行、检查与本地提交</title><desc id="desc-03">状态变更通过命令完成；测试记录证明软件检查，研究结论仍需按来源和模型审核。</desc><defs><marker id="arrow-03" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52667c"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1680" height="770" fill="#f6f8fb"/><text x="60" y="58" font-size="16" fill="#2261bd" font-weight="650" text-anchor="start">ROCKETPERF  /  ARCHITECTURE 03</text><text x="60" y="111" font-size="36" fill="#15263c" font-weight="700" text-anchor="start">任务流程：执行、检查与本地提交</text><text x="60" y="150" font-size="20" fill="#52667c" font-weight="400" text-anchor="start">状态变更通过命令完成；测试记录证明软件检查，研究结论仍需按来源和模型审核。</text><line x1="60" y1="183" x2="1620" y2="183" stroke="#bdcad8"/><g><rect x="60" y="250" width="248" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="61" y="268" width="4" height="34" fill="#2261bd"/><text x="80" y="288" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">READY</text><text x="80" y="320" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">契约与前置满足</text><text x="80" y="365" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">可领取，不等于已开工</text></g><g><rect x="388" y="250" width="248" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="389" y="268" width="4" height="34" fill="#2261bd"/><text x="408" y="288" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">ACTIVE</text><text x="408" y="320" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">负责人明确，控制在制数</text><text x="408" y="365" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">执行、产物、失败记录</text></g><g><rect x="716" y="250" width="248" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="717" y="268" width="4" height="34" fill="#2261bd"/><text x="736" y="288" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">REVIEW</text><text x="736" y="320" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">产物齐备，质量证据通过</text><text x="736" y="365" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">提交待验收，不冒充人审</text></g><g><rect x="1044" y="250" width="248" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="1045" y="268" width="4" height="34" fill="#2261bd"/><text x="1064" y="288" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">DONE</text><text x="1064" y="320" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">证据指纹仍与输入一致</text><text x="1064" y="365" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">完成后解锁后续依赖</text></g><g><rect x="1372" y="250" width="248" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="1373" y="268" width="4" height="34" fill="#2261bd"/><text x="1392" y="288" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">Git 检查点</text><text x="1392" y="320" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">审查暂存区、本地提交</text><text x="1392" y="365" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">无授权不推送远端</text></g><polyline points="308,310 388,310" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-03)"/><polyline points="636,310 716,310" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-03)"/><polyline points="964,310 1044,310" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-03)"/><polyline points="1292,310 1372,310" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-03)"/><polyline points="840,382 840,437 512,437 512,382" fill="none" stroke="#52667c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-03)" stroke-dasharray="6 5"/><text x="676" y="425" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">验收不通过：继续实现</text><text x="60" y="490" font-size="22" fill="#15263c" font-weight="650" text-anchor="start">支撑机制</text><g><rect x="60" y="530" width="450" height="144" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="61" y="548" width="4" height="34" fill="#2261bd"/><text x="80" y="568" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">单一状态来源</text><text x="80" y="600" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">project/tasks.json + 事件链</text><text x="80" y="657" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">自动生成任务板和 worknow</text></g><g><rect x="600" y="530" width="470" height="144" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="601" y="548" width="4" height="34" fill="#2261bd"/><text x="620" y="568" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">质量与运行证据</text><text x="620" y="600" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">文档 / 边界 / 测试 / 哈希 / 失败语义</text><text x="620" y="657" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">过期报告不能提交为当前验收</text></g><g><rect x="1160" y="530" width="460" height="144" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="1161" y="548" width="4" height="34" fill="#2261bd"/><text x="1180" y="568" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">阻塞与交接</text><text x="1180" y="600" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">BLOCKED：写清原因与解除条件</text><text x="1180" y="624" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">解除后重新检查依赖</text><text x="1180" y="657" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">移交负责人留事件，不直接改 Markdown</text></g><line x1="60" y1="706" x2="1620" y2="706" stroke="#bdcad8"/><text x="60" y="740" font-size="16" fill="#52667c" font-weight="400" text-anchor="start">输入来源、计算条件与验证记录分别保留</text><text x="1620" y="740" font-size="15" fill="#52667c" font-weight="400" text-anchor="end">SVG / Mermaid 可编辑源 · 由项目登记生成</text></g></svg>
