<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">程序流程图</title><desc id="flow-desc">输入经读入与检查后，按命令进入理想喷管、推力室、给定温度循环、绝热开式/补燃循环或过膨胀诊断五条求解链；求解成功输出JSON或中文表格，失败返回退出码且不写结果。</desc><defs><marker id="flow-arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4.5 L0,9 Z" fill="#55606e"/></marker></defs><g font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif"><rect width="1920" height="1080" fill="#ffffff"/><rect x="80" y="44" width="6" height="42" fill="#1f3a5f"/><text x="102" y="78" font-size="32" fill="#16212e" font-weight="700" text-anchor="start">程序流程图</text><text x="102" y="114" font-size="18" fill="#6e7a88" font-weight="400" text-anchor="start">一次计算：读入并检查输入 → 按命令进入对应求解链 → 成功写出结果，失败只返回退出码</text><rect x="80" y="164" width="300" height="588" rx="10" fill="#f2f4f6" stroke="none" stroke-width="1.2"/><text x="100" y="196" font-size="15" fill="#4a5868" font-weight="700" text-anchor="start">① 输入</text><rect x="104" y="323.0" width="252" height="120" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M104,329.0 a6,6 0 0 1 6,-6 h240 a6,6 0 0 1 6,6 v34 h-252 Z" fill="#4a5868"/><text x="122" y="350.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">读入</text><text x="122" y="395.0" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">命令行参数</text><text x="122" y="421.0" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">INI 算例 · 中文菜单</text><polyline points="230,443.0 230,479.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="104" y="483.0" width="252" height="120" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M104,489.0 a6,6 0 0 1 6,-6 h240 a6,6 0 0 1 6,6 v34 h-252 Z" fill="#4a5868"/><text x="122" y="510.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">检查</text><text x="122" y="555.0" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">单位、取值范围、模型 ID</text><text x="122" y="581.0" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start"><tspan font-weight="700" fill="#16212e">不合格即停止</tspan></text><rect x="400" y="164" width="1230" height="588" rx="10" fill="#eef2f7" stroke="none" stroke-width="1.2"/><text x="420" y="196" font-size="15" fill="#1f3a5f" font-weight="700" text-anchor="start">② 按命令选择求解链</text><polyline points="356,543.0 404,543.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><line x1="420" y1="257.0" x2="420" y2="689.0" stroke="#55606e" stroke-width="1.6"/><line x1="404" y1="543.0" x2="420" y2="543.0" stroke="#55606e" stroke-width="1.6"/><rect x="436" y="224" width="166" height="66" rx="6" fill="#ffffff" stroke="#c3ccd8" stroke-width="1.2"/><text x="452" y="253.0" font-size="17" fill="#16212e" font-weight="700" text-anchor="start">理想喷管</text><text x="452" y="277.0" font-size="12" fill="#6e7a88" font-weight="400" text-anchor="start" font-family="'Cascadia Mono',Consolas,monospace">run</text><line x1="420" y1="257.0" x2="436" y2="257.0" stroke="#55606e" stroke-width="1.6"/><polyline points="602,257.0 617,257.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="620" y="228" width="220" height="58" rx="6" fill="#ffffff" stroke="#4a5868" stroke-width="1.4"/><rect x="620" y="228" width="6" height="58" rx="2" fill="#4a5868"/><text x="733.0" y="263.0" font-size="17" fill="#16212e" font-weight="500" text-anchor="middle">给定 γ、R、T₀、P₀</text><polyline points="840,257.0 871,257.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="874" y="228" width="220" height="58" rx="6" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.4"/><rect x="874" y="228" width="6" height="58" rx="2" fill="#1f3a5f"/><text x="987.0" y="263.0" font-size="17" fill="#16212e" font-weight="500" text-anchor="middle">定比热等熵膨胀</text><line x1="1094" y1="257.0" x2="1600" y2="257.0" stroke="#9aa6b4" stroke-width="1.4"/><rect x="436" y="332" width="166" height="66" rx="6" fill="#ffffff" stroke="#c3ccd8" stroke-width="1.2"/><text x="452" y="361.0" font-size="17" fill="#16212e" font-weight="700" text-anchor="start">推力室</text><text x="452" y="385.0" font-size="12" fill="#6e7a88" font-weight="400" text-anchor="start" font-family="'Cascadia Mono',Consolas,monospace">combustion frozen-*</text><line x1="420" y1="365.0" x2="436" y2="365.0" stroke="#55606e" stroke-width="1.6"/><polyline points="602,365.0 617,365.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="620" y="336" width="220" height="58" rx="6" fill="#ffffff" stroke="#4a5868" stroke-width="1.4"/><rect x="620" y="336" width="6" height="58" rx="2" fill="#4a5868"/><text x="733.0" y="371.0" font-size="17" fill="#16212e" font-weight="500" text-anchor="middle">入口焓与元素量</text><polyline points="840,365.0 871,365.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="874" y="336" width="220" height="58" rx="6" fill="#ffffff" stroke="#1d6f6a" stroke-width="1.4"/><rect x="874" y="336" width="6" height="58" rx="2" fill="#1d6f6a"/><text x="987.0" y="371.0" font-size="17" fill="#16212e" font-weight="500" text-anchor="middle">HP 绝热平衡</text><polyline points="1094,365.0 1125,365.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="1128" y="336" width="220" height="58" rx="6" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.4"/><rect x="1128" y="336" width="6" height="58" rx="2" fill="#1f3a5f"/><text x="1241.0" y="371.0" font-size="17" fill="#16212e" font-weight="500" text-anchor="middle">冻结喷管</text><line x1="1348" y1="365.0" x2="1600" y2="365.0" stroke="#9aa6b4" stroke-width="1.4"/><rect x="436" y="440" width="166" height="66" rx="6" fill="#ffffff" stroke="#c3ccd8" stroke-width="1.2"/><text x="452" y="469.0" font-size="17" fill="#16212e" font-weight="700" text-anchor="start">给定温度循环</text><text x="452" y="493.0" font-size="12" fill="#6e7a88" font-weight="400" text-anchor="start" font-family="'Cascadia Mono',Consolas,monospace">cycle prescribed</text><line x1="420" y1="473.0" x2="436" y2="473.0" stroke="#55606e" stroke-width="1.6"/><polyline points="602,473.0 617,473.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="620" y="444" width="220" height="58" rx="6" fill="#ffffff" stroke="#a8641a" stroke-width="1.4"/><rect x="620" y="444" width="6" height="58" rx="2" fill="#a8641a"/><text x="733.0" y="479.0" font-size="17" fill="#16212e" font-weight="500" text-anchor="middle">泵功与涡轮功</text><polyline points="840,473.0 871,473.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="874" y="444" width="220" height="58" rx="6" fill="#ffffff" stroke="#1d6f6a" stroke-width="1.4"/><rect x="874" y="444" width="6" height="58" rx="2" fill="#1d6f6a"/><text x="987.0" y="479.0" font-size="17" fill="#16212e" font-weight="500" text-anchor="middle">TP 平衡 → 所需 Q</text><polyline points="1094,473.0 1125,473.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="1128" y="444" width="220" height="58" rx="6" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.4"/><rect x="1128" y="444" width="6" height="58" rx="2" fill="#1f3a5f"/><text x="1241.0" y="479.0" font-size="17" fill="#16212e" font-weight="500" text-anchor="middle">主喷管 + 支路喷管</text><line x1="1348" y1="473.0" x2="1600" y2="473.0" stroke="#9aa6b4" stroke-width="1.4"/><rect x="436" y="548" width="166" height="66" rx="6" fill="#ffffff" stroke="#c3ccd8" stroke-width="1.2"/><text x="452" y="577.0" font-size="17" fill="#16212e" font-weight="700" text-anchor="start">绝热开式 / 补燃</text><text x="452" y="601.0" font-size="12" fill="#6e7a88" font-weight="400" text-anchor="start" font-family="'Cascadia Mono',Consolas,monospace">cycle adiabatic</text><line x1="420" y1="581.0" x2="436" y2="581.0" stroke="#55606e" stroke-width="1.6"/><polyline points="602,581.0 617,581.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="620" y="552" width="220" height="58" rx="6" fill="#ffffff" stroke="#4a5868" stroke-width="1.4"/><rect x="620" y="552" width="6" height="58" rx="2" fill="#4a5868"/><text x="733.0" y="587.0" font-size="17" fill="#16212e" font-weight="500" text-anchor="middle">泵后焓（液体表）</text><polyline points="840,581.0 871,581.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="874" y="552" width="220" height="58" rx="6" fill="#ffffff" stroke="#a8641a" stroke-width="1.4"/><rect x="874" y="552" width="6" height="58" rx="2" fill="#a8641a"/><text x="987.0" y="587.0" font-size="17" fill="#16212e" font-weight="500" text-anchor="middle">轴功平衡 → 支路流量</text><polyline points="1094,581.0 1125,581.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="1128" y="552" width="220" height="58" rx="6" fill="#ffffff" stroke="#1d6f6a" stroke-width="1.4"/><rect x="1128" y="552" width="6" height="58" rx="2" fill="#1d6f6a"/><text x="1241.0" y="587.0" font-size="17" fill="#16212e" font-weight="500" text-anchor="middle">预燃室、主室 HP</text><polyline points="1348,581.0 1379,581.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="1382" y="552" width="220" height="58" rx="6" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.4"/><rect x="1382" y="552" width="6" height="58" rx="2" fill="#1f3a5f"/><text x="1495.0" y="587.0" font-size="17" fill="#16212e" font-weight="500" text-anchor="middle">主喷管 + 外排</text><line x1="1602" y1="581.0" x2="1600" y2="581.0" stroke="#9aa6b4" stroke-width="1.4"/><rect x="436" y="656" width="166" height="66" rx="6" fill="#ffffff" stroke="#c3ccd8" stroke-width="1.2"/><text x="452" y="685.0" font-size="17" fill="#16212e" font-weight="700" text-anchor="start">过膨胀诊断</text><text x="452" y="709.0" font-size="12" fill="#6e7a88" font-weight="400" text-anchor="start" font-family="'Cascadia Mono',Consolas,monospace">nozzle regime</text><line x1="420" y1="689.0" x2="436" y2="689.0" stroke="#55606e" stroke-width="1.6"/><polyline points="602,689.0 617,689.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="620" y="660" width="220" height="58" rx="6" fill="#ffffff" stroke="#4a5868" stroke-width="1.4"/><rect x="620" y="660" width="6" height="58" rx="2" fill="#4a5868"/><text x="733.0" y="695.0" font-size="17" fill="#16212e" font-weight="500" text-anchor="middle">给定 γ、R、T₀、P₀</text><polyline points="840,689.0 871,689.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="874" y="660" width="220" height="58" rx="6" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.4"/><rect x="874" y="660" width="6" height="58" rx="2" fill="#1f3a5f"/><text x="987.0" y="695.0" font-size="17" fill="#16212e" font-weight="500" text-anchor="middle">理想 pe、匹配面积比</text><line x1="1094" y1="689.0" x2="1600" y2="689.0" stroke="#9aa6b4" stroke-width="1.4"/><line x1="1600" y1="257.0" x2="1600" y2="689.0" stroke="#9aa6b4" stroke-width="1.4"/><rect x="1650" y="164" width="190" height="588" rx="10" fill="#ecf4f3" stroke="none" stroke-width="1.2"/><text x="1670" y="196" font-size="15" fill="#1d6f6a" font-weight="700" text-anchor="start">③ 结果</text><polyline points="1600,473.0 1670,473.0" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="1672" y="224" width="150" height="150" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M1672,230 a6,6 0 0 1 6,-6 h138 a6,6 0 0 1 6,6 v34 h-150 Z" fill="#1d6f6a"/><text x="1690" y="251.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">成功</text><text x="1690" y="296" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">JSON</text><text x="1690" y="324" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">或中文表格</text><rect x="1672" y="572" width="150" height="150" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M1672,578 a6,6 0 0 1 6,-6 h138 a6,6 0 0 1 6,6 v34 h-150 Z" fill="#a8641a"/><text x="1690" y="599.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">失败</text><text x="1690" y="644" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">退出码 2/3/4</text><text x="1690" y="672" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start"><tspan font-weight="700" fill="#16212e">不写结果</tspan></text><text x="1680" y="479.0" font-size="16" fill="#16212e" font-weight="700" text-anchor="start">求解完成？</text><polyline points="1747,457.0 1747,380" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><polyline points="1747,487.0 1747,566" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="400" y="771" width="26" height="16" rx="3" fill="#f2f4f6" stroke="#4a5868" stroke-width="1.4"/><text x="436" y="784" font-size="15" fill="#3a4654" font-weight="400" text-anchor="start">入口状态</text><rect x="528.0" y="771" width="26" height="16" rx="3" fill="#f8f1e7" stroke="#a8641a" stroke-width="1.4"/><text x="564.0" y="784" font-size="15" fill="#3a4654" font-weight="400" text-anchor="start">泵与涡轮</text><rect x="656.0" y="771" width="26" height="16" rx="3" fill="#ecf4f3" stroke="#1d6f6a" stroke-width="1.4"/><text x="692.0" y="784" font-size="15" fill="#3a4654" font-weight="400" text-anchor="start">燃烧平衡</text><rect x="784.0" y="771" width="26" height="16" rx="3" fill="#eef2f7" stroke="#1f3a5f" stroke-width="1.4"/><text x="820.0" y="784" font-size="15" fill="#3a4654" font-weight="400" text-anchor="start">喷管膨胀</text><rect x="80" y="820" width="1760" height="196" rx="10" fill="#f7f9fb" stroke="none" stroke-width="1.2"/><text x="108" y="864" font-size="16" fill="#1f3a5f" font-weight="700" text-anchor="start">关键关系</text><text x="108" y="912" font-size="23" fill="#16212e" font-family="Cambria Math,Cambria,Times New Roman,serif">c* = pc·At / ṁ</text><text x="368" y="912" font-size="23" fill="#16212e" font-family="Cambria Math,Cambria,Times New Roman,serif">CF = F / (pc·At)</text><text x="628" y="912" font-size="23" fill="#16212e" font-family="Cambria Math,Cambria,Times New Roman,serif">Isp = F / (ṁ·g0)</text><text x="108" y="958" font-size="16" fill="#6e7a88" font-weight="400" text-anchor="start">ṁ 为喉部阻塞质量流量，pc 为燃烧室压力，At 为喉部面积，g0 = 9.80665 m/s²。</text><text x="960" y="864" font-size="16" fill="#1f3a5f" font-weight="700" text-anchor="start">使用要点</text><text x="960" y="904" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">附着喷管遇 pa &gt; pe 返回越域，不自动转入诊断；诊断给理想解和经验参考，不计算分离位置。</text><text x="960" y="938" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">给定温度循环输出维持温度所需的热量 Q；绝热循环 Q = 0，由入口焓和元素量求燃温。</text><text x="960" y="972" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">退出码 2 = 命令用法错误，3 = 文件或格式错误，4 = 求解失败（含越域、不收敛）。</text><line x1="940" y1="844" x2="940" y2="992" stroke="#d5dbe3" stroke-width="1"/></g></svg>
