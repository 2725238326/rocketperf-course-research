<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Microsoft YaHei,Arial,sans-serif">
<rect width="1600" height="900" fill="#f5f7f8"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#557983"/></marker></defs>
<text x="45" y="65" font-size="34" fill="#243c46" font-weight="bold">程序流程：选择入口，再执行对应计算</text>
<text x="45" y="107" font-size="23" fill="#243c46" font-weight="normal">各支路独立调用；NASA9物性、HP和喷管内核按模型需要复用。</text>
<rect x="40" y="330" width="290" height="182" rx="9" fill="white" stroke="#206b78" stroke-width="2"/>
<text x="58" y="363" font-size="24" fill="#206b78" font-weight="bold">输入与校验</text>
<text x="58" y="395" font-size="20" fill="#243c46" font-weight="normal">CLI / 交互菜单 / INI</text>
<text x="58" y="424" font-size="20" fill="#243c46" font-weight="normal">解析单位、范围、模型</text>
<text x="58" y="453" font-size="20" fill="#243c46" font-weight="normal">进入所选计算支路</text>
<path d="M330 421H365" fill="none" stroke="#557983" stroke-width="2"/>
<path d="M365 219V699" fill="none" stroke="#557983" stroke-width="2"/>
<path d="M1210 219V699" fill="none" stroke="#557983" stroke-width="2"/>
<rect x="410" y="170" width="765" height="98" rx="9" fill="white" stroke="#206b78" stroke-width="2"/>
<text x="428" y="203" font-size="24" fill="#206b78" font-weight="bold">L0 理想喷管</text>
<text x="428" y="235" font-size="20" fill="#243c46" font-weight="normal">给定 γ、R、T₀、P₀、面积与背压 → 定比热喷管；不经过HP</text>
<path d="M365 219H404" fill="none" stroke="#557983" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1175 219H1210" fill="none" stroke="#557983" stroke-width="2"/>
<rect x="410" y="290" width="765" height="98" rx="9" fill="white" stroke="#206b78" stroke-width="2"/>
<text x="428" y="323" font-size="24" fill="#206b78" font-weight="bold">推力室</text>
<text x="428" y="355" font-size="20" fill="#243c46" font-weight="normal">气态 / 液态入口焓与元素 → HP → 冻结喷管 → 流量与推力</text>
<path d="M365 339H404" fill="none" stroke="#557983" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1175 339H1210" fill="none" stroke="#557983" stroke-width="2"/>
<rect x="410" y="410" width="765" height="98" rx="9" fill="white" stroke="#206b78" stroke-width="2"/>
<text x="428" y="443" font-size="24" fill="#206b78" font-weight="bold">给定热状态外排循环</text>
<text x="428" y="475" font-size="20" fill="#243c46" font-weight="normal">泵 → 给定温度TP → 涡轮与分流 → 两喷管及所需热量Q</text>
<path d="M365 459H404" fill="none" stroke="#557983" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1175 459H1210" fill="none" stroke="#557983" stroke-width="2"/>
<rect x="410" y="530" width="765" height="98" rx="9" fill="white" stroke="#206b78" stroke-width="2"/>
<text x="428" y="563" font-size="24" fill="#206b78" font-weight="bold">绝热开式 / 富氧补燃循环</text>
<text x="428" y="595" font-size="20" fill="#243c46" font-weight="normal">泵后焓 → 预燃HP与轴功 → 分流或回流 → 主室HP / 喷管</text>
<path d="M365 579H404" fill="none" stroke="#557983" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1175 579H1210" fill="none" stroke="#557983" stroke-width="2"/>
<rect x="410" y="650" width="765" height="98" rx="9" fill="white" stroke="#a26127" stroke-width="2"/>
<text x="428" y="683" font-size="24" fill="#a26127" font-weight="bold">regime 独立诊断入口</text>
<text x="428" y="715" font-size="20" fill="#243c46" font-weight="normal">理想状态 → pa/pe、匹配面积比、0.4pa经验参考；不预测分离</text>
<path d="M365 699H404" fill="none" stroke="#557983" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1175 699H1210" fill="none" stroke="#557983" stroke-width="2"/>
<path d="M1210 401H1248" fill="none" stroke="#557983" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1255" y="300" width="305" height="240" rx="9" fill="white" stroke="#206b78" stroke-width="2"/>
<text x="1273" y="333" font-size="24" fill="#206b78" font-weight="bold">返回状态</text>
<text x="1273" y="365" font-size="20" fill="#243c46" font-weight="normal">成功：JSON / 中文表格</text>
<text x="1273" y="394" font-size="20" fill="#243c46" font-weight="normal">失败：状态码与诊断</text>
<text x="1273" y="423" font-size="20" fill="#243c46" font-weight="normal">计算失败不写回结果</text>
<text x="1273" y="452" font-size="20" fill="#243c46" font-weight="normal">归档由运行工具完成</text>
<text x="45" y="797" font-size="23" fill="#243c46" font-weight="normal">附着喷管：pa &gt; pe 返回越域。仅部分交互入口提供诊断；循环不会自动改换模型。</text>
<text x="45" y="843" font-size="23" fill="#243c46" font-weight="normal">c*由喉部阻塞流量得到；给定温度循环的所需Q与绝热循环的Q=0分开处理。</text>
</svg>
