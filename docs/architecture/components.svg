<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="components-title components-desc"><title id="components-title">代码模块与调用关系</title><desc id="components-desc">入口层（命令行、输入输出）调用计算层的热化学、喷管和循环模块；循环调用喷管与热化学，喷管调用热化学；所有模块共用数值与错误契约基础层。</desc><defs><marker id="components-arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4.5 L0,9 Z" fill="#55606e"/></marker></defs><g font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif"><rect width="1920" height="1080" fill="#ffffff"/><rect x="80" y="44" width="6" height="42" fill="#1f3a5f"/><text x="102" y="78" font-size="32" fill="#16212e" font-weight="700" text-anchor="start">代码模块与调用关系</text><text x="102" y="114" font-size="18" fill="#6e7a88" font-weight="400" text-anchor="start">C17，30 个源文件约 5900 行；上层调用下层，计算层与基础层不做文件读写、打印和动态内存分配</text><rect x="80" y="146" width="1760" height="176" rx="10" fill="#f2f4f6" stroke="none" stroke-width="1.2"/><text x="100" y="178" font-size="15" fill="#4a5868" font-weight="700" text-anchor="start">入口层</text><rect x="104" y="190" width="820" height="112" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M104,196 a6,6 0 0 1 6,-6 h808 a6,6 0 0 1 6,6 v34 h-820 Z" fill="#4a5868"/><text x="122" y="217.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">命令行用例编排</text><text x="908" y="216.0" font-size="13" fill="#dfe7ef" font-weight="400" text-anchor="end" font-family="'Cascadia Mono',Consolas,monospace">src/cli</text><text x="122" y="262" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">命令分派 · 参数解析 · <tspan font-weight="700" fill="#16212e">中文交互菜单</tspan></text><text x="122" y="290" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">结果写 stdout，诊断写 stderr，失败返回非零退出码</text><rect x="996" y="190" width="820" height="112" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M996,196 a6,6 0 0 1 6,-6 h808 a6,6 0 0 1 6,6 v34 h-820 Z" fill="#4a5868"/><text x="1014" y="217.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">输入 / 输出 / 平台</text><text x="1800" y="216.0" font-size="13" fill="#dfe7ef" font-weight="400" text-anchor="end" font-family="'Cascadia Mono',Consolas,monospace">src/adapters</text><text x="1014" y="262" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">读取 <tspan font-weight="700" fill="#16212e">INI 算例</tspan>，检查单位与取值范围</text><text x="1014" y="290" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">输出 JSON 或中文表格；<tspan font-weight="700" fill="#16212e">求解成功后才写出</tspan></text><polyline points="924,246 992,246" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#components-arrow)"/><rect x="80" y="346" width="1760" height="370" rx="10" fill="#eef2f7" stroke="none" stroke-width="1.2"/><text x="100" y="378" font-size="15" fill="#1f3a5f" font-weight="700" text-anchor="start">计算层</text><rect x="104" y="390" width="540" height="232" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M104,396 a6,6 0 0 1 6,-6 h528 a6,6 0 0 1 6,6 v34 h-540 Z" fill="#1d6f6a"/><text x="122" y="417.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">热化学与物性</text><text x="628" y="416.0" font-size="13" fill="#dfe7ef" font-weight="400" text-anchor="end" font-family="'Cascadia Mono',Consolas,monospace">src/thermo</text><text x="122" y="462" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start"><tspan font-weight="700" fill="#16212e">NASA9</tspan> 九系数物性</text><text x="122" y="492" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">九气相 <tspan font-weight="700" fill="#16212e">TP / HP</tspan> 化学平衡</text><text x="122" y="522" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">液态 CH₄ / O₂ 物性表求入口焓</text><text x="122" y="552" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">石墨活度 <tspan font-weight="700" fill="#16212e">a_C &gt; 1</tspan> 时拒算</text><rect x="690" y="390" width="540" height="232" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M690,396 a6,6 0 0 1 6,-6 h528 a6,6 0 0 1 6,6 v34 h-540 Z" fill="#1f3a5f"/><text x="708" y="417.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">喷管模型</text><text x="1214" y="416.0" font-size="13" fill="#dfe7ef" font-weight="400" text-anchor="end" font-family="'Cascadia Mono',Consolas,monospace">src/nozzle</text><text x="708" y="462" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start"><tspan font-weight="700" fill="#16212e">定比热</tspan>理想喷管</text><text x="708" y="492" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start"><tspan font-weight="700" fill="#16212e">冻结、变物性</tspan>喷管</text><text x="708" y="522" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">喉部阻塞求流量、c*、推力、比冲</text><text x="708" y="552" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">过膨胀诊断（不预测分离）</text><rect x="1276" y="390" width="540" height="232" rx="6" fill="#ffffff" stroke="#a8641a" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M1276,396 a6,6 0 0 1 6,-6 h528 a6,6 0 0 1 6,6 v34 h-540 Z" fill="#a8641a"/><text x="1294" y="417.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">部件与整机边界</text><text x="1800" y="416.0" font-size="13" fill="#dfe7ef" font-weight="400" text-anchor="end" font-family="'Cascadia Mono',Consolas,monospace">src/cycle</text><text x="1294" y="462" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">泵功与涡轮<tspan font-weight="700" fill="#16212e">轴功平衡</tspan></text><text x="1294" y="492" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">给定温度外排循环（旧模型）</text><text x="1294" y="522" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start"><tspan font-weight="700" fill="#16212e">Q = 0</tspan> 开式 / 富氧补燃循环</text><text x="1294" y="552" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">质量、元素、焓、轴功守恒</text><polyline points="1276,506 1234,506" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#components-arrow)"/><polyline points="690,506 648,506" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#components-arrow)"/><polyline points="1546,622 1546,672 374,672 374,626" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#components-arrow)"/><text x="960" y="664" font-size="15" fill="#6e7a88" font-weight="400" text-anchor="middle">循环直接调用 HP 平衡，求预燃室与主室状态</text><polyline points="374,302 374,386" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#components-arrow)"/><polyline points="820,302 820,386" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#components-arrow)"/><polyline points="1100,302 1100,386" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#components-arrow)"/><polyline points="1546,302 1546,386" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#components-arrow)"/><rect x="80" y="740" width="1760" height="160" rx="10" fill="#f2f4f6" stroke="none" stroke-width="1.2"/><text x="100" y="772" font-size="15" fill="#4a5868" font-weight="700" text-anchor="start">基础层</text><rect x="104" y="784" width="1712" height="96" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M104,790 a6,6 0 0 1 6,-6 h1700 a6,6 0 0 1 6,6 v34 h-1712 Z" fill="#4a5868"/><text x="122" y="811.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">数值与错误契约</text><text x="1800" y="810.0" font-size="13" fill="#dfe7ef" font-weight="400" text-anchor="end" font-family="'Cascadia Mono',Consolas,monospace">src/core</text><text x="122" y="856" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">夹逼求根 · 有限数检查 · <tspan font-weight="700" fill="#16212e">状态码与错误信息</tspan>；被所有模块使用，本身无依赖</text><polyline points="960,716 960,780" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#components-arrow)" stroke-dasharray="6 4"/><rect x="104" y="927" width="26" height="16" rx="3" fill="#f2f4f6" stroke="#4a5868" stroke-width="1.4"/><text x="140" y="940" font-size="15" fill="#3a4654" font-weight="400" text-anchor="start">入口 / 基础</text><rect x="257.2" y="927" width="26" height="16" rx="3" fill="#ecf4f3" stroke="#1d6f6a" stroke-width="1.4"/><text x="293.2" y="940" font-size="15" fill="#3a4654" font-weight="400" text-anchor="start">物性与燃烧</text><rect x="400.2" y="927" width="26" height="16" rx="3" fill="#eef2f7" stroke="#1f3a5f" stroke-width="1.4"/><text x="436.2" y="940" font-size="15" fill="#3a4654" font-weight="400" text-anchor="start">喷管</text><rect x="498.2" y="927" width="26" height="16" rx="3" fill="#ffffff" stroke="#a8641a" stroke-width="1.4" stroke-dasharray="6 4"/><text x="534.2" y="940" font-size="15" fill="#3a4654" font-weight="400" text-anchor="start">研究原型（未实机标定）</text><text x="104" y="986" font-size="16" fill="#6e7a88" font-weight="400" text-anchor="start">实线箭头：调用方向。虚线箭头：所有模块共用基础层。依赖方向由 tools/project.py check 逐个 #include 检查。</text><text x="104" y="1018" font-size="16" fill="#6e7a88" font-weight="400" text-anchor="start">输入 / 输出层也直接引用三个计算模块来组装算例；完整依赖列表见 components.mmd。</text></g></svg>
