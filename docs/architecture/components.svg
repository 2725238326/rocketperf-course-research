<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1130" viewBox="0 0 1680 1130" role="img" aria-labelledby="title-02 desc-02"><title id="title-02">功能核心：燃烧室状态如何进入喷管</title><desc id="desc-02">实线表示编排 / 调用；虚线表示公共值类型依赖。灰色虚线框是未实现的整机循环。</desc><defs><marker id="arrow-02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52667c"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1680" height="1130" fill="#f6f8fb"/><text x="60" y="58" font-size="16" fill="#2261bd" font-weight="650" text-anchor="start">ROCKETPERF  /  ARCHITECTURE 02</text><text x="60" y="111" font-size="36" fill="#15263c" font-weight="700" text-anchor="start">功能核心：燃烧室状态如何进入喷管</text><text x="60" y="150" font-size="20" fill="#52667c" font-weight="400" text-anchor="start">实线表示编排 / 调用；虚线表示公共值类型依赖。灰色虚线框是未实现的整机循环。</text><line x1="60" y1="183" x2="1620" y2="183" stroke="#bdcad8"/><g><rect x="650" y="224" width="380" height="124" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="651" y="242" width="4" height="34" fill="#2261bd"/><text x="670" y="262" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">命令行用例编排</text><text x="670" y="294" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">run / thermo / combustion → JSON</text><text x="670" y="331" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">src/cli · 用例入口</text></g><g><rect x="100" y="430" width="360" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="101" y="448" width="4" height="34" fill="#2261bd"/><text x="120" y="468" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">输入 / 输出 / 平台</text><text x="120" y="500" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">INI校验 / JSON / UTF-8</text><text x="120" y="545" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">src/adapters · 教学算例协议</text></g><g><rect x="650" y="430" width="400" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="651" y="448" width="4" height="34" fill="#2261bd"/><text x="670" y="468" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">热化学与物性</text><text x="670" y="500" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">NASA9 → TP平衡 → HP燃烧室</text><text x="670" y="545" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">九种C/H/O气体 · 组分 / cp / h / s</text></g><g><rect x="1220" y="430" width="360" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="1221" y="448" width="4" height="34" fill="#2261bd"/><text x="1240" y="468" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">数值与错误契约</text><text x="1240" y="500" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">夹逼求根 / 显式失败 / 容差</text><text x="1240" y="545" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">src/core · 通用数值基础</text></g><g><rect x="650" y="676" width="400" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="651" y="694" width="4" height="34" fill="#2261bd"/><text x="670" y="714" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">喷管模型</text><text x="670" y="746" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">定比热基线 / 燃烧室冻结温变</text><text x="670" y="791" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">连续 / 能量 / 熵 / 喉部声速残差</text></g><polyline points="730,348 730,382 280,382 280,430" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)"/><text x="488" y="369" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">文件与报告</text><polyline points="850,348 850,430" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)"/><text x="947" y="393" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">TP / HP / 物性</text><polyline points="1030,286 1400,286 1400,430" fill="none" stroke="#52667c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)" stroke-dasharray="6 5"/><text x="1200" y="271" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">状态 / 版本</text><polyline points="1030,325 1140,325 1140,628 1020,628 1020,676" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)"/><text x="1225" y="615" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">喷管求解</text><polyline points="1050,490 1220,490" fill="none" stroke="#52667c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)" stroke-dasharray="6 5"/><text x="1135" y="477" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">状态契约</text><polyline points="850,676 850,562" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)"/><text x="950" y="621" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">组分 / 温变物性</text><polyline points="1050,742 1400,742 1400,562" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)"/><text x="1220" y="729" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">数值策略</text><polyline points="460,518 554,518 554,736 650,736" fill="none" stroke="#52667c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)" stroke-dasharray="6 5"/><text x="574" y="717" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">SI值类型</text><polyline points="460,550 500,550 500,846 1580,846 1580,562" fill="none" stroke="#52667c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)" stroke-dasharray="6 5"/><text x="1450" y="834" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">公共状态契约</text><g><rect x="100" y="902" width="440" height="122" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="101" y="920" width="4" height="34" fill="#2261bd"/><text x="120" y="940" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">工程工具与验证</text><text x="120" y="972" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">任务 / 构建 / 守恒 / CEA对照</text><text x="120" y="1007" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">tools · tests · project</text></g><g><rect x="1150" y="902" width="430" height="122" rx="9" fill="#eef2f6" stroke="#52667c" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="1151" y="920" width="4" height="34" fill="#52667c"/><text x="1170" y="940" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">整机循环与损失</text><text x="1170" y="972" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">控制体、支路、功率与损失</text><text x="1170" y="1007" font-size="14" fill="#52667c" font-weight="600" text-anchor="start">扩展计划，不冒充已实现</text></g><text x="600" y="942" font-size="20" fill="#087f78" font-weight="650" text-anchor="start">计算边界</text><text x="600" y="975" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">核心无I/O；失败保持输出。</text><text x="600" y="1005" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">气态方法基准 ≠ 真实发动机。</text><line x1="60" y1="1066" x2="1620" y2="1066" stroke="#bdcad8"/><text x="60" y="1100" font-size="16" fill="#52667c" font-weight="400" text-anchor="start">输入来源、计算条件与验证记录分别保留</text><text x="1620" y="1100" font-size="15" fill="#52667c" font-weight="400" text-anchor="end">SVG / Mermaid 可编辑源 · 由项目登记生成</text></g></svg>
