<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180" role="img" aria-labelledby="title-02 desc-02"><title id="title-02">功能核心：支路功率与两路喷管如何连接</title><desc id="desc-02">实线为主要用例 / 求解；虚线为公共基础依赖。灰色为受限循环原型，不代表补燃已实现。</desc><defs><marker id="arrow-02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52667c"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1680" height="1180" fill="#f6f8fb"/><text x="60" y="58" font-size="16" fill="#2261bd" font-weight="650" text-anchor="start">ROCKETPERF  /  ARCHITECTURE 02</text><text x="60" y="111" font-size="36" fill="#15263c" font-weight="700" text-anchor="start">功能核心：支路功率与两路喷管如何连接</text><text x="60" y="150" font-size="20" fill="#52667c" font-weight="400" text-anchor="start">实线为主要用例 / 求解；虚线为公共基础依赖。灰色为受限循环原型，不代表补燃已实现。</text><line x1="60" y1="183" x2="1620" y2="183" stroke="#bdcad8"/><g><rect x="60" y="230" width="310" height="145" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="61" y="248" width="4" height="34" fill="#2261bd"/><text x="80" y="268" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">命令行用例编排</text><text x="80" y="300" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">run / thermo / combustion</text><text x="80" y="324" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">cycle / study</text><text x="80" y="358" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">src/cli · 用例入口</text></g><g><rect x="470" y="230" width="430" height="145" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="471" y="248" width="4" height="34" fill="#2261bd"/><text x="490" y="268" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">输入 / 输出 / 平台</text><text x="490" y="300" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">闭合INI / JSON / UTF-8路径</text><text x="490" y="358" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">src/adapters · 成功求解后才输出</text></g><g><rect x="470" y="510" width="430" height="165" rx="9" fill="#eef2f6" stroke="#52667c" stroke-width="1.5"/><rect x="471" y="528" width="4" height="34" fill="#52667c"/><text x="490" y="548" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">部件与整机边界</text><text x="490" y="580" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">液泵 → 轴功率 → 外排支路</text><text x="490" y="604" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">主 / 支推力与所需热交换</text><text x="490" y="628" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">单输入扫描 · 几何代价 · 有限步响应</text><text x="490" y="658" font-size="14" fill="#52667c" font-weight="600" text-anchor="start">prototype · 给定热状态，拒绝回流</text></g><g><rect x="1160" y="230" width="460" height="190" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="1161" y="248" width="4" height="34" fill="#2261bd"/><text x="1180" y="268" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">热化学与物性</text><text x="1180" y="300" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">NASA9 → 九气相产物TP / HP</text><text x="1180" y="324" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">固定CH4(L) / RP-1反应物锚点</text><text x="1180" y="348" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">单相液体表 → h / 元素库存 → HP</text><text x="1180" y="403" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">RP-1限10MPa；不含泵 / 分流 / 循环闭合</text></g><g><rect x="1160" y="510" width="460" height="165" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="1161" y="528" width="4" height="34" fill="#2261bd"/><text x="1180" y="548" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">喷管模型</text><text x="1180" y="580" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">定比热 / 温变冻结 / 固定喉部</text><text x="1180" y="604" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">甲烷与RP-1同几何成对比较</text><text x="1180" y="628" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">单喷管流量、推力与显式残差</text><text x="1180" y="658" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">主喷管与支路复用 · 非整机闭合</text></g><g><rect x="650" y="870" width="430" height="120" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="651" y="888" width="4" height="34" fill="#2261bd"/><text x="670" y="908" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">数值与错误契约</text><text x="670" y="940" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">夹逼求根 / 状态码 / 显式失败</text><text x="670" y="973" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">所有计算模块允许依赖的公共基础</text></g><polyline points="370,280 470,280" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)"/><text x="420" y="266" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">文件流程</text><polyline points="685,375 685,510" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)"/><text x="751" y="486" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">循环用例</text><polyline points="900,570 1020,570 1020,300 1160,300" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)"/><text x="1030" y="423" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">发生器 / 主室TP</text><polyline points="900,625 1160,625" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)"/><text x="1030" y="611" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">两路喷管</text><polyline points="1390,510 1390,420" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)"/><text x="1494" y="472" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">气相组分 / 物性</text><polyline points="215,375 215,450 970,450 970,250 1160,250" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)"/><text x="550" y="435" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">thermo / combustion 直接用例</text><polyline points="150,375 150,745 1480,745 1480,675" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)"/><text x="1240" y="733" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">定比热 / 冻结喷管直接用例</text><polyline points="685,675 685,870" fill="none" stroke="#52667c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)" stroke-dasharray="6 5"/><text x="723" y="791" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">core</text><polyline points="1160,330 1110,330 1110,930 1080,930" fill="none" stroke="#52667c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)" stroke-dasharray="6 5"/><text x="1140" y="812" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">core</text><polyline points="1390,675 1390,930 1080,930" fill="none" stroke="#52667c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)" stroke-dasharray="6 5"/><text x="1220" y="916" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">core</text><polyline points="540,375 400,375 400,930 650,930" fill="none" stroke="#52667c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)" stroke-dasharray="6 5"/><text x="495" y="916" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">值类型 / 状态契约</text><text x="60" y="1035" font-size="20" fill="#087f78" font-weight="650" text-anchor="start">纯计算核心无I/O；失败保持输出。循环热量是维持给定状态所需的交换，不是绝热燃烧预测。</text><text x="60" y="1070" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">为避免连线遮挡：CLI → core，adapters → nozzle / thermo 的公共依赖在Mermaid中完整列出。</text><line x1="60" y1="1116" x2="1620" y2="1116" stroke="#bdcad8"/><text x="60" y="1150" font-size="16" fill="#52667c" font-weight="400" text-anchor="start">输入来源、计算条件与验证记录分别保留</text><text x="1620" y="1150" font-size="15" fill="#52667c" font-weight="400" text-anchor="end">SVG / Mermaid 可编辑源 · 由项目登记生成</text></g></svg>
