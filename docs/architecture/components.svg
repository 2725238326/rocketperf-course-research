<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="950" viewBox="0 0 1680 950" role="img" aria-labelledby="title-02 desc-02"><title id="title-02">功能核心：边界清楚，模块可以独立维护</title><desc id="desc-02">实线表示主要编排 / 调用；虚线表示接口依赖。灰色虚线框明确标出未实现扩展。</desc><defs><marker id="arrow-02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52667c"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1680" height="950" fill="#f6f8fb"/><text x="60" y="58" font-size="16" fill="#2261bd" font-weight="650" text-anchor="start">ROCKETPERF  /  ARCHITECTURE 02</text><text x="60" y="111" font-size="36" fill="#15263c" font-weight="700" text-anchor="start">功能核心：边界清楚，模块可以独立维护</text><text x="60" y="150" font-size="20" fill="#52667c" font-weight="400" text-anchor="start">实线表示主要编排 / 调用；虚线表示接口依赖。灰色虚线框明确标出未实现扩展。</text><line x1="60" y1="183" x2="1620" y2="183" stroke="#bdcad8"/><g><rect x="680" y="224" width="320" height="124" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="681" y="242" width="4" height="34" fill="#2261bd"/><text x="700" y="262" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">命令行用例编排</text><text x="700" y="294" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">装载 → 求解 → 输出</text><text x="700" y="331" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">src/cli · 用例入口</text></g><g><rect x="100" y="430" width="360" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="101" y="448" width="4" height="34" fill="#2261bd"/><text x="120" y="468" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">输入 / 输出 / 平台</text><text x="120" y="500" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">算例校验 / JSON / UTF-8</text><text x="120" y="545" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">src/adapters · 外部协议</text></g><g><rect x="660" y="430" width="360" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="661" y="448" width="4" height="34" fill="#2261bd"/><text x="680" y="468" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">理想喷管模型</text><text x="680" y="500" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">定比热、准一维、明确适用域</text><text x="680" y="545" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">src/nozzle · 当前物理核心</text></g><g><rect x="1220" y="430" width="360" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="1221" y="448" width="4" height="34" fill="#2261bd"/><text x="1240" y="468" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">数值与错误契约</text><text x="1240" y="500" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">夹逼求根 / 容差 / 显式失败</text><text x="1240" y="545" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">src/core · 通用数值基础</text></g><polyline points="760,348 760,390 280,390 280,430" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)"/><text x="488" y="377" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">文件与报告</text><polyline points="840,348 840,430" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)"/><text x="877" y="395" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">调用</text><polyline points="1000,286 1400,286 1400,430" fill="none" stroke="#52667c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)" stroke-dasharray="6 5"/><text x="1200" y="271" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">公共状态 / 版本</text><polyline points="1020,489 1220,489" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)"/><text x="1120" y="477" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">数值策略</text><polyline points="460,489 660,489" fill="none" stroke="#52667c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)" stroke-dasharray="6 5"/><text x="560" y="477" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">SI 值类型</text><polyline points="460,535 540,535 540,614 1400,614 1400,562" fill="none" stroke="#52667c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-02)" stroke-dasharray="6 5"/><text x="958" y="603" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">虚线：公共值类型 / 状态契约依赖</text><text x="100" y="665" font-size="20" fill="#087f78" font-weight="650" text-anchor="start">接口边界</text><text x="250" y="665" font-size="19" fill="#52667c" font-weight="400" text-anchor="start">include/rocketperf：SI字段、只读输入、成功才写输出；核心不依赖文件、网络或界面。</text><g><rect x="100" y="714" width="490" height="122" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="101" y="732" width="4" height="34" fill="#2261bd"/><text x="120" y="752" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">工程工具与验证</text><text x="120" y="784" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">任务登记 / 构建测试 / 运行快照</text><text x="120" y="819" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">tools · scripts · tests · project</text></g><g><rect x="660" y="714" width="430" height="122" rx="9" fill="#eef2f6" stroke="#52667c" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="661" y="732" width="4" height="34" fill="#52667c"/><text x="680" y="752" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">热化学与物性</text><text x="680" y="784" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">NASA9 / HP平衡，实现与验证待完成</text><text x="680" y="819" font-size="14" fill="#52667c" font-weight="600" text-anchor="start">技术路线已定 · 尚未实现</text></g><g><rect x="1150" y="714" width="430" height="122" rx="9" fill="#eef2f6" stroke="#52667c" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="1151" y="732" width="4" height="34" fill="#52667c"/><text x="1170" y="752" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">整机循环与损失</text><text x="1170" y="784" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">控制体、支路、功率与损失</text><text x="1170" y="819" font-size="14" fill="#52667c" font-weight="600" text-anchor="start">扩展计划，不冒充已实现</text></g><line x1="60" y1="886" x2="1620" y2="886" stroke="#bdcad8"/><text x="60" y="920" font-size="16" fill="#52667c" font-weight="400" text-anchor="start">边界先行 · 输入可追溯 · 结论有验证</text><text x="1620" y="920" font-size="15" fill="#52667c" font-weight="400" text-anchor="end">SVG / Mermaid 可编辑源 · 由项目登记生成</text></g></svg>
