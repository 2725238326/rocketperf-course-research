<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="772" viewBox="0 0 1280 772" role="img" aria-labelledby="components-title components-desc"><title id="components-title">模块架构</title><desc id="components-desc">入口层调用热化学、喷管、循环三个计算模块；循环调用喷管与热化学，喷管调用热化学；所有模块共用数值与错误契约。</desc><defs><marker id="ah-main" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/></marker><marker id="ah-sub" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/></marker><marker id="ah-call" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#9aa1ab"/></marker><marker id="ah-loop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a06d00"/></marker><marker id="ah-verify" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7b1fa2"/></marker><marker id="ah-fail" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#c62828"/></marker></defs><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><rect width="1280" height="772" fill="#ffffff"/><text x="40" y="46" font-size="22" fill="#1f2328" font-weight="700" text-anchor="start">模块架构</text><text x="40" y="70" font-size="12" fill="#5f6670" text-anchor="start">C17 · 30 个 .c · 约 5900 行；上层调用下层，计算层与基础层不做文件读写和动态内存分配</text><line x1="40" y1="86" x2="1240" y2="86" stroke="#e1e4e8" stroke-width="1"/><rect x="60" y="104" width="1160" height="168" rx="8" fill="#f6f7f9" stroke="#e1e4e8" stroke-width="1"/><text x="74" y="126" font-size="13" fill="#0277bd" font-weight="700" text-anchor="start">入口层</text><rect x="84" y="132" width="520" height="124" rx="8" fill="#ffffff" stroke="#0277bd" stroke-width="1.5"/><text x="100" y="160" font-size="16" fill="#0277bd" font-weight="700" text-anchor="start">命令行用例编排</text><text x="590" y="159" font-size="10" fill="#5f6670" text-anchor="end" font-family="'Cascadia Mono',Consolas,'JetBrains Mono',monospace">src/cli</text><line x1="100" y1="172" x2="588" y2="172" stroke="#e5e7eb" stroke-width="1"/><text x="100" y="194" font-size="12" fill="#1f2328" text-anchor="start">命令分派 · 参数解析 · 交互菜单</text><text x="100" y="215" font-size="12" fill="#1f2328" text-anchor="start">stdout 结果，stderr 诊断，失败非零退出</text><text x="100" y="242" font-size="10" fill="#5f6670" text-anchor="start">4 个 .c · 约 1500 行 · 已实现</text><rect x="676" y="132" width="520" height="124" rx="8" fill="#ffffff" stroke="#0277bd" stroke-width="1.5"/><text x="692" y="160" font-size="16" fill="#0277bd" font-weight="700" text-anchor="start">输入 / 输出 / 平台</text><text x="1182" y="159" font-size="10" fill="#5f6670" text-anchor="end" font-family="'Cascadia Mono',Consolas,'JetBrains Mono',monospace">src/adapters</text><line x1="692" y1="172" x2="1180" y2="172" stroke="#e5e7eb" stroke-width="1"/><text x="692" y="194" font-size="12" fill="#1f2328" text-anchor="start">INI 算例：单位、范围、模型 ID</text><text x="692" y="215" font-size="12" fill="#1f2328" text-anchor="start">JSON / 中文表格；求解成功后才写出</text><text x="692" y="242" font-size="10" fill="#5f6670" text-anchor="start">9 个 .c · 约 1800 行 · 已实现</text><polyline points="604,194 676,194" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-main)"/><polyline points="344,256 344,292" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round"/><polyline points="936,256 936,292" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round"/><line x1="254" y1="292" x2="1034" y2="292" stroke="#6b7280" stroke-width="1"/><circle cx="344" cy="292" r="3" fill="#6b7280"/><circle cx="936" cy="292" r="3" fill="#6b7280"/><polyline points="254,292 254,334" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-main)"/><polyline points="644,292 644,334" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-main)"/><polyline points="1034,292 1034,334" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-main)"/><rect x="60" y="306" width="1160" height="230" rx="8" fill="#f6f7f9" stroke="#e1e4e8" stroke-width="1"/><text x="74" y="328" font-size="13" fill="#d35400" font-weight="700" text-anchor="start">计算层</text><rect x="84" y="334" width="340" height="148" rx="8" fill="#ffffff" stroke="#d35400" stroke-width="1.5"/><text x="100" y="362" font-size="16" fill="#d35400" font-weight="700" text-anchor="start">热化学与物性</text><text x="410" y="361" font-size="10" fill="#5f6670" text-anchor="end" font-family="'Cascadia Mono',Consolas,'JetBrains Mono',monospace">src/thermo</text><line x1="100" y1="374" x2="408" y2="374" stroke="#e5e7eb" stroke-width="1"/><text x="100" y="396" font-size="12" fill="#1f2328" text-anchor="start">NASA9 物性 · 九气相 HP 平衡</text><text x="100" y="417" font-size="12" fill="#1f2328" text-anchor="start">液态 CH₄ / RP-1 入口焓</text><text x="100" y="438" font-size="12" fill="#1f2328" text-anchor="start">a_C &gt; 1 时拒算</text><text x="100" y="468" font-size="10" fill="#5f6670" text-anchor="start">7 个 .c · 约 1200 行 · 已实现</text><rect x="474" y="334" width="340" height="148" rx="8" fill="#ffffff" stroke="#d35400" stroke-width="1.5"/><text x="490" y="362" font-size="16" fill="#d35400" font-weight="700" text-anchor="start">喷管模型</text><text x="800" y="361" font-size="10" fill="#5f6670" text-anchor="end" font-family="'Cascadia Mono',Consolas,'JetBrains Mono',monospace">src/nozzle</text><line x1="490" y1="374" x2="798" y2="374" stroke="#e5e7eb" stroke-width="1"/><text x="490" y="396" font-size="12" fill="#1f2328" text-anchor="start">理想 / 冻结组分喷管</text><text x="490" y="417" font-size="12" fill="#1f2328" text-anchor="start">喉部阻塞求流量、c*、Isp</text><text x="490" y="438" font-size="12" fill="#1f2328" text-anchor="start">过膨胀只评估，不预测分离</text><text x="490" y="468" font-size="10" fill="#5f6670" text-anchor="start">4 个 .c · 约 600 行 · 已实现</text><rect x="864" y="334" width="340" height="148" rx="8" fill="#ffffff" stroke="#a06d00" stroke-width="1.5" stroke-dasharray="5 4"/><text x="880" y="362" font-size="16" fill="#a06d00" font-weight="700" text-anchor="start">部件与整机边界</text><text x="1190" y="361" font-size="10" fill="#5f6670" text-anchor="end" font-family="'Cascadia Mono',Consolas,'JetBrains Mono',monospace">src/cycle</text><line x1="880" y1="374" x2="1188" y2="374" stroke="#e5e7eb" stroke-width="1"/><text x="880" y="396" font-size="12" fill="#1f2328" text-anchor="start">泵 · 涡轮轴功平衡</text><text x="880" y="417" font-size="12" fill="#1f2328" text-anchor="start">Q = 0 开式外排 / 富氧补燃</text><text x="880" y="438" font-size="12" fill="#1f2328" text-anchor="start">质量、元素、焓、轴功守恒</text><text x="880" y="468" font-size="10" fill="#5f6670" text-anchor="start">4 个 .c · 约 700 行 · 研究原型</text><polyline points="474,408 424,408" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-main)"/><polyline points="864,408 814,408" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-main)"/><polyline points="1034,482 1034,512 254,512 254,482" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-main)"/><rect x="601.6" y="505" width="84.8" height="14" rx="3" fill="#ffffff"/><text x="644" y="515.5" font-size="10" fill="#5f6670" text-anchor="middle">循环直接调用 HP</text><rect x="60" y="576" width="1160" height="146" rx="8" fill="#f6f7f9" stroke="#e1e4e8" stroke-width="1"/><text x="74" y="598" font-size="13" fill="#546e7a" font-weight="700" text-anchor="start">基础层</text><rect x="84" y="604" width="1120" height="102" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="1.5"/><text x="100" y="632" font-size="16" fill="#546e7a" font-weight="700" text-anchor="start">数值与错误契约</text><text x="1190" y="631" font-size="10" fill="#5f6670" text-anchor="end" font-family="'Cascadia Mono',Consolas,'JetBrains Mono',monospace">src/core</text><line x1="100" y1="644" x2="1188" y2="644" stroke="#e5e7eb" stroke-width="1"/><text x="100" y="666" font-size="12" fill="#1f2328" text-anchor="start">夹逼求根 · 有限数检查 · 状态码；无 I/O、无堆分配</text><text x="100" y="692" font-size="10" fill="#5f6670" text-anchor="start">2 个 .c · 约 100 行 · 已实现</text><polyline points="644,536 644,604" fill="none" stroke="#9aa1ab" stroke-width="1" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ah-call)"/><rect x="610" y="563" width="68" height="14" rx="3" fill="#ffffff"/><text x="644" y="573.5" font-size="10" fill="#5f6670" text-anchor="middle">全部模块依赖</text><polyline points="84,222 36,222 36,650 84,650" fill="none" stroke="#9aa1ab" stroke-width="1" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ah-call)"/><rect x="84" y="741" width="18" height="12" rx="3" fill="#ffffff" stroke="#a06d00" stroke-width="1.5" stroke-dasharray="5 4"/><text x="110" y="751" font-size="10" fill="#5f6670" text-anchor="start">研究原型</text><polyline points="190,748 224,748" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-main)"/><text x="232" y="752" font-size="10" fill="#5f6670" text-anchor="start">调用</text><polyline points="290,748 324,748" fill="none" stroke="#9aa1ab" stroke-width="1" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ah-call)"/><text x="332" y="752" font-size="10" fill="#5f6670" text-anchor="start">公共依赖（入口层同样依赖基础层）</text></g></svg>
