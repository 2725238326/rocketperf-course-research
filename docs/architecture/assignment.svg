<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="assignment-title assignment-desc"><title id="assignment-title">作业要求与完成情况</title><desc id="assignment-desc">三项作业要求（REQ-01至REQ-06）各自的方法、结果与未覆盖内容；经解析解、CEA同源对照、守恒残差与复跑验证；四项交付（REQ-07至REQ-11）：程序源代码、发布版、展示 PPT、研究报告。</desc><defs><marker id="assignment-arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4.5 L0,9 Z" fill="#55606e"/></marker></defs><g font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif"><rect width="1920" height="1080" fill="#ffffff"/><rect x="80" y="44" width="6" height="42" fill="#1f3a5f"/><text x="102" y="78" font-size="32" fill="#16212e" font-weight="700" text-anchor="start">作业要求与完成情况</text><text x="102" y="114" font-size="18" fill="#6e7a88" font-weight="400" text-anchor="start">朱雀三号 · 长征十号乙：三项研究要求的方法与计算结果，经统一验证后形成四项交付</text><rect x="80" y="146" width="560" height="584" rx="10" fill="#eef2f7" stroke="none" stroke-width="1.2"/><text x="104" y="196" font-size="34" fill="#1f3a5f" font-weight="700" text-anchor="start">01</text><a href="../../调研/README.md"><text x="160" y="194" font-size="24" fill="#16212e" font-weight="700" text-anchor="start">调查工作方案与能力</text></a><text x="160" y="222" font-size="14" fill="#6e7a88" font-weight="400" text-anchor="start">REQ-01 · REQ-04</text><rect x="100" y="246" width="520" height="132" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M100,252 a6,6 0 0 1 6,-6 h508 a6,6 0 0 1 6,6 v34 h-520 Z" fill="#4a5868"/><text x="118" y="273.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">方法</text><text x="118" y="318" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">按级段分别整理公开资料</text><text x="118" y="348" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">每个参数记出处、日期、子型、工况</text><rect x="100" y="394" width="520" height="236" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M100,400 a6,6 0 0 1 6,-6 h508 a6,6 0 0 1 6,6 v34 h-520 Z" fill="#1d6f6a"/><text x="118" y="421.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">结果</text><text x="118" y="466" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">朱雀三号遥一：一级 <tspan font-weight="700" fill="#16212e">9 × TQ-12A</tspan></text><text x="118" y="502" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">　二级 <tspan font-weight="700" fill="#16212e">1 × TQ-15A</tspan> 真空型</text><text x="118" y="538" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">长征十号乙首飞：一级 <tspan font-weight="700" fill="#16212e">7 台液氧煤油</tspan></text><text x="118" y="574" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">　二级 <tspan font-weight="700" fill="#16212e">液氧甲烷</tspan></text><rect x="100" y="646" width="520" height="64" rx="6" fill="#f8f1e7" stroke="#a8641a" stroke-width="1"/><text x="120" y="672" font-size="13" fill="#a8641a" font-weight="700" text-anchor="start">未覆盖</text><text x="120" y="698" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">无同批单机性能参数，不给型号绝对性能</text><polyline points="360.0,730 360.0,770" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#assignment-arrow)"/><rect x="680" y="146" width="560" height="584" rx="10" fill="#eef2f7" stroke="none" stroke-width="1.2"/><text x="704" y="196" font-size="34" fill="#1f3a5f" font-weight="700" text-anchor="start">02</text><a href="../engineering.md"><text x="760" y="194" font-size="24" fill="#16212e" font-weight="700" text-anchor="start">用基本理论计算性能</text></a><text x="760" y="222" font-size="14" fill="#6e7a88" font-weight="400" text-anchor="start">REQ-02 · REQ-05 · REQ-06</text><rect x="700" y="246" width="520" height="132" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M700,252 a6,6 0 0 1 6,-6 h508 a6,6 0 0 1 6,6 v34 h-520 Z" fill="#4a5868"/><text x="718" y="273.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">方法</text><text x="718" y="318" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">C17：NASA9 物性 → HP 平衡求燃温</text><text x="718" y="348" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">冻结喷管 → 流量、推力、比冲</text><rect x="700" y="394" width="520" height="236" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M700,400 a6,6 0 0 1 6,-6 h508 a6,6 0 0 1 6,6 v34 h-520 Z" fill="#1d6f6a"/><text x="718" y="421.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">结果</text><text x="718" y="466" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">Pc 10 MPa、面积比 10、真空</text><text x="718" y="502" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">　甲烷 Isp <tspan font-weight="700" fill="#16212e">324.4 s</tspan>，RP-1 <tspan font-weight="700" fill="#16212e">310.6 s</tspan></text><text x="718" y="538" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">一级开式 / 补燃情景</text><text x="718" y="574" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">　推力 <tspan font-weight="700" fill="#16212e">290.5 / 285.5 kN</tspan></text><rect x="700" y="646" width="520" height="64" rx="6" fill="#f8f1e7" stroke="#a8641a" stroke-width="1"/><text x="720" y="672" font-size="13" fill="#a8641a" font-weight="700" text-anchor="start">未覆盖</text><text x="720" y="698" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">输入为研究假设，不是发动机标定数据</text><polyline points="960.0,730 960.0,770" fill="none" stroke="#55606e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#assignment-arrow)"/><rect x="1280" y="146" width="560" height="584" rx="10" fill="#eef2f7" stroke="none" stroke-width="1.2"/><text x="1304" y="196" font-size="34" fill="#1f3a5f" font-weight="700" text-anchor="start">03</text><a href="../improvement-analysis.md"><text x="1360" y="194" font-size="24" fill="#16212e" font-weight="700" text-anchor="start">优缺点与可能改进</text></a><text x="1360" y="222" font-size="14" fill="#6e7a88" font-weight="400" text-anchor="start">REQ-03</text><rect x="1300" y="246" width="520" height="132" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M1300,252 a6,6 0 0 1 6,-6 h508 a6,6 0 0 1 6,6 v34 h-520 Z" fill="#4a5868"/><text x="1318" y="273.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">方法</text><text x="1318" y="318" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">固定其余输入，每次只改一个因素</text><text x="1318" y="348" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">收益与代价同时给出</text><rect x="1300" y="394" width="520" height="236" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2"/><path d="M1300,400 a6,6 0 0 1 6,-6 h508 a6,6 0 0 1 6,6 v34 h-520 Z" fill="#1d6f6a"/><text x="1318" y="421.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="start">结果</text><text x="1318" y="466" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">同喉面积：甲烷 Isp <tspan font-weight="700" fill="#16212e">+13.9 s</tspan>，推力 <tspan font-weight="700" fill="#16212e">−0.20%</tspan></text><text x="1318" y="502" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">面积比 10→40：Isp <tspan font-weight="700" fill="#16212e">+23.4 s</tspan></text><text x="1318" y="538" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">　代价：出口面积 <tspan font-weight="700" fill="#16212e">× 4</tspan></text><text x="1318" y="574" font-size="17" fill="#3a4654" font-weight="400" text-anchor="start">富燃发生器 O/F <tspan font-weight="700" fill="#16212e">0.9～1.0</tspan> 触及积碳边界</text><rect x="1300" y="646" width="520" height="64" rx="6" fill="#f8f1e7" stroke="#a8641a" stroke-width="1"/><text x="1320" y="672" font-size="13" fill="#a8641a" font-weight="700" text-anchor="start">未覆盖</text><text x="1320" y="698" font-size="16" fill="#3a4654" font-weight="400" text-anchor="start">未计算喷管质量、冷却、流动分离</text><polyline points="1560.0,730 