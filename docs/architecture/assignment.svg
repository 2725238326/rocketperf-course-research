<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="assignment-title assignment-desc"><title id="assignment-title">作业要求与完成情况</title><desc id="assignment-desc">三项作业要求（REQ-01至REQ-06）各自的方法、结果与未覆盖内容；经解析解、CEA同源对照、守恒残差与复跑验证；四项交付（REQ-07至REQ-11）：程序源代码、发布版、展示 PPT、研究报告。</desc><defs><marker id="ah-main" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/></marker><marker id="ah-sub" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/></marker><marker id="ah-call" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#9aa1ab"/></marker><marker id="ah-loop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a06d00"/></marker><marker id="ah-verify" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7b1fa2"/></marker><marker id="ah-fail" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#c62828"/></marker></defs><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><rect width="1920" height="1080" fill="#ffffff"/><text x="80" y="58" font-size="32" fill="#1f2328" font-weight="700" text-anchor="start">作业要求与完成情况</text><text x="80" y="90" font-size="18" fill="#5f6670" text-anchor="start">朱雀三号 · 长征十号乙：三项研究要求的方法与计算结果，经统一验证后形成四项交付</text><line x1="80" y1="100" x2="1840" y2="100" stroke="#e1e4e8" stroke-width="1"/><rect x="80" y="112" width="560" height="618" rx="10" fill="#f6f7f9" stroke="#e1e4e8" stroke-width="1"/><text x="104" y="160" font-size="30" fill="#0277bd" font-weight="700" text-anchor="start" font-family="'Cascadia Mono',Consolas,'JetBrains Mono',monospace">01</text><a href="../../调研/README.md"><text x="160" y="158" font-size="24" fill="#1f2328" font-weight="700" text-anchor="start">调查工作方案与能力</text></a><text x="160" y="184" font-size="14" fill="#5f6670" text-anchor="start" font-family="'Cascadia Mono',Consolas,'JetBrains Mono',monospace">REQ-01 · REQ-04</text><rect x="100" y="206" width="520" height="140" rx="8" fill="#ffffff" stroke="#0277bd" stroke-width="1.5"/><text x="120" y="236" font-size="16" fill="#0277bd" font-weight="700" text-anchor="start">方法</text><line x1="120" y1="250" x2="600" y2="250" stroke="#e5e7eb" stroke-width="1"/><text x="120" y="282" font-size="17" fill="#1f2328" text-anchor="start">按级段分别整理公开资料</text><text x="120" y="312" font-size="17" fill="#1f2328" text-anchor="start">每个参数记出处、日期、子型、工况</text><rect x="100" y="362" width="520" height="232" rx="8" fill="#ffffff" stroke="#d35400" stroke-width="1.5"/><text x="120" y="392" font-size="16" fill="#d35400" font-weight="700" text-anchor="start">结果</text><line x1="120" y1="406" x2="600" y2="406" stroke="#e5e7eb" stroke-width="1"/><text x="120" y="442" font-size="17" fill="#1f2328" text-anchor="start">朱雀三号遥一：一级 <tspan font-weight="700" fill="#d35400">9 × TQ-12A</tspan></text><text x="120" y="480" font-size="17" fill="#1f2328" text-anchor="start">　二级 <tspan font-weight="700" fill="#d35400">1 × TQ-15A</tspan> 真空型</text><text x="120" y="518" font-size="17" fill="#1f2328" text-anchor="start">长征十号乙首飞：一级 <tspan font-weight="700" fill="#d35400">7 台液氧煤油</tspan></text><text x="120" y="556" font-size="17" fill="#1f2328" text-anchor="start">　二级 <tspan font-weight="700" fill="#d35400">液氧甲烷</tspan></text><rect x="100" y="610" width="520" height="100" rx="8" fill="#ffffff" stroke="#a06d00" stroke-width="1.5" stroke-dasharray="5 4"/><text x="120" y="644" font-size="15" fill="#a06d00" font-weight="700" text-anchor="start">未覆盖</text><text x="120" y="680" font-size="16" fill="#1f2328" text-anchor="start">无同批单机性能参数，不给型号绝对性能</text><polyline points="360,730 360,768" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-main)"/><rect x="680" y="112" width="560" height="618" rx="10" fill="#f6f7f9" stroke="#e1e4e8" stroke-width="1"/><text x="704" y="160" font-size="30" fill="#0277bd" font-weight="700" text-anchor="start" font-family="'Cascadia Mono',Consolas,'JetBrains Mono',monospace">02</text><a href="../engineering.md"><text x="760" y="158" font-size="24" fill="#1f2328" font-weight="700" text-anchor="start">用基本理论计算性能</text></a><text x="760" y="184" font-size="14" fill="#5f6670" text-anchor="start" font-family="'Cascadia Mono',Consolas,'JetBrains Mono',monospace">REQ-02 · REQ-05 · REQ-06</text><rect x="700" y="206" width="520" height="140" rx="8" fill="#ffffff" stroke="#0277bd" stroke-width="1.5"/><text x="720" y="236" font-size="16" fill="#0277bd" font-weight="700" text-anchor="start">方法</text><line x1="720" y1="250" x2="1200" y2="250" stroke="#e5e7eb" stroke-width="1"/><text x="720" y="282" font-size="17" fill="#1f2328" text-anchor="start">C17：NASA9 物性 → HP 平衡求燃温</text><text x="720" y="312" font-size="17" fill="#1f2328" text-anchor="start">冻结喷管 → 流量、推力、比冲</text><rect x="700" y="362" width="520" height="232" rx="8" fill="#ffffff" stroke="#d35400" stroke-width="1.5"/><text x="720" y="392" font-size="16" fill="#d35400" font-weight="700" text-anchor="start">结果</text><line x1="720" y1="406" x2="1200" y2="406" stroke="#e5e7eb" stroke-width="1"/><text x="720" y="442" font-size="17" fill="#1f2328" text-anchor="start">Pc 10 MPa、面积比 10、真空</text><text x="720" y="480" font-size="17" fill="#1f2328" text-anchor="start">　甲烷 Isp <tspan font-weight="700" fill="#d35400">324.4 s</tspan>，RP-1 <tspan font-weight="700" fill="#d35400">310.6 s</tspan></text><text x="720" y="518" font-size="17" fill="#1f2328" text-anchor="start">一级开式 / 补燃情景</text><text x="720" y="556" font-size="17" fill="#1f2328" text-anchor="start">　推力 <tspan font-weight="700" fill="#d35400">290.5 / 285.5 kN</tspan></text