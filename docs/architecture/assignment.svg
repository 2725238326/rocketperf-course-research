1320" y="480" font-size="17" fill="#1f2328" text-anchor="start">面积比 10→40：Isp <tspan font-weight="700" fill="#d35400">+23.4 s</tspan></text><text x="1320" y="518" font-size="17" fill="#1f2328" text-anchor="start">　代价：出口面积 <tspan font-weight="700" fill="#d35400">× 4</tspan></text><text x="1320" y="556" font-size="17" fill="#1f2328" text-anchor="start">富燃发生器 O/F <tspan font-weight="700" fill="#d35400">0.9～1.0</tspan> 触及积碳边界</text><rect x="1300" y="610" width="520" height="100" rx="8" fill="#ffffff" stroke="#a06d00" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1320" y="644" font-size="15" fill="#a06d00" font-weight="700" text-anchor="start">未覆盖</text><text x="1320" y="680" font-size="16" fill="#1f2328" text-anchor="start">未计算喷管质量、冷却、流动分离</text><polyline points="1560,730 1560,768" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-main)"/><rect x="80" y="772" width="1760" height="112" rx="10" fill="#f8f2fb" stroke="#7b1fa2" stroke-width="1.5"/><text x="108" y="836" font-size="22" fill="#7b1fa2" font-weight="700" text-anchor="start">验证</text><text x="240" y="816" font-size="18" fill="#1f2328" font-weight="700" text-anchor="start">解析解</text><text x="240" y="850" font-size="16" fill="#5f6670" text-anchor="start">L0 喷管、泵功与公式一致</text><text x="644" y="816" font-size="18" fill="#1f2328" font-weight="700" text-anchor="start">CEA 同源对照</text><text x="644" y="850" font-size="16" fill="#5f6670" text-anchor="start">液甲烷燃温最大差 <tspan font-weight="700" fill="#7b1fa2">0.0044 K</tspan></text><text x="1048" y="816" font-size="18" fill="#1f2328" font-weight="700" text-anchor="start">守恒残差</text><text x="1048" y="850" font-size="16" fill="#5f6670" text-anchor="start">质量 · 元素 · 焓 · 轴功</text><text x="1452" y="816" font-size="18" fill="#1f2328" font-weight="700" text-anchor="start">可复跑</text><text x="1452" y="850" font-size="16" fill="#5f6670" text-anchor="start">输入、构建版本、输出哈希</text><polyline points="960,884 960,918" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-main)"/><rect x="80" y="922" width="1760" height="112" rx="10" fill="#eef8f9" stroke="#00838f" stroke-width="1.5"/><text x="108" y="986" font-size="22" fill="#00838f" font-weight="700" text-anchor="start">交付</text><rect x="220" y="940" width="384" height="76" rx="8" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="238" y="970" font-size="18" fill="#1f2328" font-weight="700" text-anchor="start">程序源代码</text><text x="238" y="1000" font-size="15" fill="#5f6670" text-anchor="start">C17 核心与测试</text><rect x="624" y="940" width="384" height="76" rx="8" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="642" y="970" font-size="18" fill="#1f2328" font-weight="700" text-anchor="start">发布版</text><text x="642" y="1000" font-size="15" fill="#5f6670" text-anchor="start">Windows 控制台</text><rect x="1028" y="940" width="384" height="76" rx="8" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="1046" y="970" font-size="18" fill="#1f2328" font-weight="700" text-anchor="start">展示 PPT</text><text x="1046" y="1000" font-size="15" fill="#5f6670" text-anchor="start">10 月 16 日 · 15 分钟</text><rect x="1432" y="940" width="384" height="76" rx="8" fill="#ffffff" stroke="#c5cad3" stroke-width="1"/><text x="1450" y="970" font-size="18" fill="#1f2328" font-weight="700" text-anchor="start">研究报告</text><text x="1450" y="1000" font-size="15" fill="#5f6670" text-anchor="start">10 项内容 · 分工</text><a href="../../作业要求/大作业1_要求存档.md"><text x="1840" y="1062" font-size="13" fill="#5f6670" text-anchor="end">数值为给定假设下的程序结果，输入见报告第 3、7 节　·　要求原文：作业要求/大作业1_要求存档.md　·　交付 REQ-07～11</text></a></g></svg>
