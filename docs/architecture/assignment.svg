<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1480" viewBox="0 0 1920 1480" role="img" aria-labelledby="assignment-title assignment-desc"><title id="assignment-title">作业要求与动力系统研究架构</title><desc id="assignment-desc">三条课程研究主线对应证据参数、C17计算和条件性改进分析；共同验证支撑四项交付；连续单相液体表已接独立HP和固定喷管，真实型号、泵与完整循环仍有缺口。</desc><defs><marker id="flow-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#53697d"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect x="0" y="0" width="1920" height="1480" rx="0" fill="#f3f6fa" stroke="#f3f6fa" stroke-width="1.4"/><text x="60" y="48" font-size="17" fill="#245dc2" font-weight="650">ROCKETPERF  /  COURSEWORK × SYSTEM DESIGN</text><text x="60" y="108" font-size="43" fill="#172d46" font-weight="700">从作业要求到可验证的动力系统研究</text><text x="60" y="151" font-size="24" fill="#53697d" font-weight="400">研究对象：朱雀三号 · 长征十号乙   ｜   按级段、子型和工况分别比较</text><text x="60" y="188" font-size="20" fill="#53697d" font-weight="400">老师要求回答三个问题；软件服务于研究，不以模块数量代替结论。</text><a href="../requirements-map.md"><rect x="60" y="210" width="576" height="145" rx="14" fill="#ffffff" stroke="#cfdae6" stroke-width="1.4"/><text x="84" y="250" font-size="23" fill="#245dc2" font-weight="650">01</text><text x="135" y="251" font-size="27" fill="#172d46" font-weight="650">调查工作方案与能力</text><text x="84" y="293" font-size="21" fill="#53697d" font-weight="400">先核对对象和公开证据，再确定能比较什么。</text><text x="84" y="330" font-size="17" fill="#245dc2" font-weight="600">老师要求  REQ-01 · REQ-04</text></a><a href="../requirements-map.md"><rect x="672" y="210" width="576" height="145" rx="14" fill="#ffffff" stroke="#cfdae6" stroke-width="1.4"/><text x="696" y="250" font-size="23" fill="#245dc2" font-weight="650">02</text><text x="747" y="251" font-size="27" fill="#172d46" font-weight="650">用基本理论分析性能</text><text x="696" y="293" font-size="21" fill="#53697d" font-weight="400">C语言自动计算，交代输入、方法和适用条件。</text><text x="696" y="330" font-size="17" fill="#245dc2" font-weight="600">老师要求  REQ-02 · REQ-05 · REQ-06</text></a><a href="../requirements-map.md"><rect x="1284" y="210" width="576" height="145" rx="14" fill="#ffffff" stroke="#cfdae6" stroke-width="1.4"/><text x="1308" y="250" font-size="23" fill="#245dc2" font-weight="650">03</text><text x="1359" y="251" font-size="27" fill="#172d46" font-weight="650">研究优缺点及可能改进</text><text x="1308" y="293" font-size="21" fill="#53697d" font-weight="400">包含计算，同时说明收益、代价和局限。</text><text x="1308" y="330" font-size="17" fill="#245dc2" font-weight="600">老师要求  REQ-03</text></a><path d="M249,355 L249,404" stroke="#245dc2" stroke-width="2.4" fill="none" marker-end="url(#flow-arrow)"/><path d="M960,355 L960,404" stroke="#245dc2" stroke-width="2.4" fill="none" marker-end="url(#flow-arrow)"/><path d="M1671,355 L1671,404" stroke="#245dc2" stroke-width="2.4" fill="none" marker-end="url(#flow-arrow)"/><rect x="60" y="410" width="378" height="575" rx="14" fill="#ffffff" stroke="#cfdae6" stroke-width="1.4"/><a href="../../调研/README.md"><text x="84" y="454" font-size="29" fill="#172d46" font-weight="650">证据与参数</text></a><text x="84" y="488" font-size="20" fill="#087f83" font-weight="600">两型分别建账，不拼接参数</text><text x="84" y="542" font-size="22" fill="#172d46" font-weight="400">原文与日期</text><text x="84" y="576" font-size="22" fill="#172d46" font-weight="400">级段 · 子型 · 批次</text><text x="84" y="610" font-size="22" fill="#172d46" font-weight="400">原单位 · 工况 · 系统边界</text><line x1="84" y1="637" x2="414" y2="637" stroke="#cfdae6"/><text x="84" y="678" font-size="21" fill="#53697d" font-weight="400">事实：可定位的原文</text><text x="84" y="713" font-size="21" fill="#53697d" font-weight="400">派生：公式与输入可复核</text><text x="84" y="748" font-size="21" fill="#53697d" font-weight="400">假设：单独标注用途</text><text x="84" y="783" font-size="21" fill="#53697d" font-weight="400">未知：留空，不自动补数</text><a href="../research-reference-coverage.md"><text x="84" y="854" font-size="21" fill="#a56215" font-weight="650">真实型号输入仍有缺口</text></a><text x="84" y="892" font-size="20" fill="#53697d" font-weight="400">缺参数不阻断方法验证</text><text x="84" y="923" font-size="20" fill="#53697d" font-weight="400">但不能输出型号绝对性能</text><path d="M438,678 L488,678" stroke="#245dc2" stroke-width="2.4" fill="none" marker-end="url(#flow-arrow)"/><rect x="494" y="410" width="932" height="575" rx="14" fill="#edf3fd" stroke="#b6c9e9" stroke-width="1.4"/><a href="../engineering.md"><text x="520" y="454" font-size="29" fill="#172d46" font-weight="650">C17 计算核心</text></a><text x="520" y="488" font-size="20" fill="#53697d" font-weight="400">项目实现选择：零维 / 准一维 / 稳态；不是有限元或CFD</text><rect x="520" y="518" width="250" height="143" rx="10" fill="#ffffff" stroke="#245dc2" stroke-width="1.4"/><text x="538" y="552" font-size="23" fill="#172d46" font-weight="650">物性与燃烧状态</text><text x="538" y="586" font-size="19" fill="#53697d" font-weight="400">九气相TP/HP · 固定锚点</text><text x="538" y="613" font-size="19" fill="#53697d" font-weight="400">单相液体表 → h / 元素库存</text><text x="538" y="642" font-size="16" fill="#245dc2" font-weight="600">连续液体已接HP；不含泵/循环</text><rect x="821" y="518" width="250" height="143" rx="10" fill="#ffffff" stroke="#245dc2" stroke-width="1.4"/><text x="839" y="552" font-size="23" fill="#172d46" font-weight="650">冻结喷管</text><text x="839" y="586" font-size="19" fill="#53697d" font-weight="400">温变物性 / 阻塞通量</text><text x="839" y="613" font-size="19" fill="#53697d" font-weight="400">流量 · c* · 推力 · 比冲</text><text x="839" y="642" font-size="16" fill="#245dc2" font-weight="600">给定流量 / 固定喉面积</text><rect x="1122" y="518" width="278" height="143" rx="10" fill="#ffffff" stroke="#245dc2" stroke-width="1.4"/><text x="1140" y="552" font-size="23" fill="#172d46" font-weight="650">单点与扫描结果</text><text x="1140" y="586" font-size="19" fill="#53697d" font-weight="400">状态 · 残差 · 越域原因</text><text x="1140" y="613" font-size="19" fill="#53697d" font-weight="400">尺寸 · 同条件性能变化</text><text x="1140" y="642" font-size="16" fill="#245dc2" font-weight="600">成功与失败都保留</text><path d="M770,589 L815,589" stroke="#245dc2" stroke-width="2.4" fill="none" marker-end="url(#flow-arrow)"/><path d="M1071,589 L1116,589" stroke="#245dc2" stroke-width="2.4" fill="none" marker-end="url(#flow-arrow)"/><rect x="520" y="700" width="250" height="143" rx="10" fill="#ffffff" stroke="#087f83" stroke-width="1.4"/><text x="538" y="734" font-size="23" fill="#172d46" font-weight="650">恒密度泵与轴功</text><text x="538" y="768" font-size="19" fill="#53697d" font-weight="400">压升 / 密度 / 效率</text><text x="538" y="795" font-size="19" fill="#53697d" font-weight="400">泵功 → 支路流量</text><text x="538" y="824" font-size="16" fill="#087f83" font-weight="600">入口焓与密度显式给定</text><rect x="821" y="700" width="250" height="143" rx="10" fill="#ffffff" stroke="#087f83" stroke-width="1.4"/><text x="839" y="734" font-size="23" fill="#172d46" font-weight="650">给定热状态外排</text><text x="839" y="768" font-size="19" fill="#53697d" font-weight="400">发生器TP → 冻结涡轮</text><text x="839" y="795" font-size="19" fill="#53697d" font-weight="400">分流后主室TP → 喷管</text><text x="839" y="824" font-size="16" fill="#087f83" font-weight="600">受限原型 · 不支持回流</text><rect x="1122" y="700" width="278" height="143" rx="10" fill="#ffffff" stroke="#087f83" stroke-width="1.4"/><text x="1140" y="734" font-size="23" fill="#172d46" font-weight="650">整机口径与热边界</text><text x="1140" y="768" font-size="19" fill="#53697d" font-weight="400">两路轴向推力 / 总消耗</text><text x="1140" y="795" font-size="19" fill="#53697d" font-weight="400">维持状态所需热交换</text><text x="1140" y="824" font-size="16" fill="#087f83" font-weight="600">倒算热量 ≠ 冷却负荷</text><path d="M770,771 L815,771" stroke="#087f83" stroke-width="2.4" fill="none" marker-end="url(#flow-arrow)"/><path d="M1071,771 L1116,771" stroke="#087f83" stroke-width="2.4" fill="none" marker-end="url(#flow-arrow)"/><text x="520" y="888" font-size="21" fill="#172d46" font-weight="600">自动执行：严格参数输入 → CLI编排 → 纯C求解 → JSON / 运行记录</text><text x="520" y="927" font-size="20" fill="#53697d" font-weight="400">Python仅管理、复核和绘图；定比热旧模型保留为教学 / 回归基准。</text><text x="520" y="960" font-size="20" fill="#a56215" font-weight="600">连续液体已接单独HP/固定喷管；泵、分流、循环仍未闭合。</text><path d="M1426,678 L1476,678" stroke="#245dc2" stroke-width="2.4" fill="none" marker-end="url(#flow-arrow)"/><rect x="1482" y="410" width="378" height="575" rx="14" fill="#ffffff" stroke="#cfdae6" stroke-width="1.4"/><a href="../improvement-analysis.md"><text x="1506" y="454" font-size="29" fill="#172d46" font-weight="650">研究分析</text></a><text x="1506" y="488" font-size="20" fill="#087f83" font-weight="600">比较必须使用相同条件</text><text x="1506" y="542" font-size="21" fill="#172d46" font-weight="400">喷管面积比与环境背压</text><text x="1506" y="576" font-size="21" fill="#172d46" font-weight="400">支路排气的轴向贡献</text><text x="1506" y="610" font-size="21" fill="#172d46" font-weight="400">效率与输入的局部响应</text><line x1="1506" y1="637" x2="1836" y2="637" stroke="#cfdae6"/><text x="1506" y="678" font-size="20" fill="#53697d" font-weight="400">量化：推力 / 比冲收益</text><text x="1506" y="713" font-size="20" fill="#53697d" font-weight="400">同时报告：出口尺寸代价</text><text x="1506" y="748" font-size="20" fill="#53697d" font-weight="400">说明：固定几何或重新定尺寸</text><text x="1506" y="783" font-size="20" fill="#53697d" font-weight="400">指出：模型域与缺失物理</text><text x="1506" y="854" font-size="21" fill="#a56215" font-weight="650">已有合成研究，不是型号改装</text><text x="1506" y="892" font-size="20" fill="#53697d" font-weight="400">局部扰动不是置信区间</text><text x="1506" y="923" font-size="20" fill="#53697d" font-weight="400">条件性趋势不是实测结论</text><rect x="60" y="1017" width="1800" height="119" rx="12" fill="#e8f4f2" stroke="#bad9d3" stroke-width="1.4"/><text x="84" y="1058" font-size="25" fill="#087f83" font-weight="650">共同验证</text><text x="286" y="1058" font-size="22" fill="#172d46" font-weight="600">解析极限与守恒</text><text x="286" y="1100" font-size="19" fill="#53697d" font-weight="400">物理关系 / 失败输出保持</text><text x="674" y="1058" font-size="22" fill="#172d46" font-weight="600">固定NASA9 / CEA对照</text><text x="674" y="1100" font-size="19" fill="#53697d" font-weight="400">同源物性，不是实验验证</text><text x="1102" y="1058" font-size="22" fill="#172d46" font-weight="600">完整计算记录</text><text x="1102" y="1100" font-size="19" fill="#53697d" font-weight="400">输入 / 状态 / 构建与哈希</text><text x="1490" y="1058" font-size="22" fill="#172d46" font-weight="600">固定版本复跑</text><text x="1490" y="1100" font-size="19" fill="#53697d" font-weight="400">软件PASS ≠ 科学结论</text><text x="60" y="1181" font-size="27" fill="#172d46" font-weight="650">最终交付</text><text x="263" y="1181" font-size="20" fill="#53697d" font-weight="400">老师要求 REQ-07—REQ-11  ｜  当前先完成研究与计算，PPT和最终报告后置</text><rect x="60" y="1205" width="414" height="127" rx="12" fill="#ffffff" stroke="#cfdae6" stroke-width="1.4"/><text x="82" y="1242" font-size="25" fill="#172d46" font-weight="650">程序源代码</text><text x="82" y="1276" font-size="19" fill="#53697d" font-weight="400">C核心 · 输入 · 测试 · 构建说明</text><text x="82" y="1309" font-size="17" fill="#245dc2" font-weight="600">已有阶段产物</text><rect x="522" y="1205" width="414" height="127" rx="12" fill="#ffffff" stroke="#cfdae6" stroke-width="1.4"/><text x="544" y="1242" font-size="25" fill="#172d46" font-weight="650">程序发布版</text><text x="544" y="1276" font-size="19" fill="#53697d" font-weight="400">Windows控制台即可 · 可复跑</text><text x="544" y="1309" font-size="17" fill="#245dc2" font-weight="600">阶段交接 ≠ 最终发布</text><rect x="984" y="1205" width="414" height="127" rx="12" fill="#fffaf1" stroke="#e5cda9" stroke-width="1.4"/><text x="1006" y="1242" font-size="25" fill="#172d46" font-weight="650">展示PPT</text><text x="1006" y="1276" font-size="19" fill="#53697d" font-weight="400">2026-10-16 第3—5节</text><text x="1006" y="1309" font-size="17" fill="#a56215" font-weight="600">展示≤10分钟 · 提问≤5分钟</text><rect x="1446" y="1205" width="414" height="127" rx="12" fill="#fffaf1" stroke="#e5cda9" stroke-width="1.4"/><text x="1468" y="1242" font-size="25" fill="#172d46" font-weight="650">研究报告</text><text x="1468" y="1276" font-size="19" fill="#53697d" font-weight="400">要求的10项内容 · 真实人员分工</text><text x="1468" y="1309" font-size="17" fill="#a56215" font-weight="600">结论与引用须对应实际程序</text><text x="60" y="1376" font-size="22" fill="#a56215" font-weight="650">尚未覆盖</text><text x="211" y="1376" font-size="21" fill="#53697d" font-weight="400">通用液体EOS / 煤油 · 泵后压升与分流 · 全循环硬件 · 冷却分离寿命 · 型号独立参考</text><line x1="60" y1="1410" x2="1860" y2="1410" stroke="#cfdae6"/><a href="../../作业要求/大作业1_要求存档.md"><text x="60" y="1448" font-size="17" fill="#53697d" font-weight="400">要求依据：用户照片转录与课件差异记录；未指定有限元、CFD、GUI或CEA。</text></a><text x="1070" y="1448" font-size="17" fill="#53697d" font-weight="400">两型直接原文核验截至2026-10-03；本图不刷新线上事实。</text></g></svg>
