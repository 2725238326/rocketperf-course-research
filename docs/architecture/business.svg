<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="710" viewBox="0 0 1680 710" role="img" aria-labelledby="title-01 desc-01"><title id="title-01">业务流程：从证据到研究结论</title><desc id="desc-01">核心目标是回答性能与改进问题。软件、文献和图表共同支撑同一条证据链。</desc><defs><marker id="arrow-01" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52667c"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><rect width="1680" height="710" fill="#f6f8fb"/><text x="60" y="58" font-size="16" fill="#2261bd" font-weight="650" text-anchor="start">ROCKETPERF  /  ARCHITECTURE 01</text><text x="60" y="111" font-size="36" fill="#15263c" font-weight="700" text-anchor="start">业务流程：从证据到研究结论</text><text x="60" y="150" font-size="20" fill="#52667c" font-weight="400" text-anchor="start">核心目标是回答性能与改进问题。软件、文献和图表共同支撑同一条证据链。</text><line x1="60" y1="183" x2="1620" y2="183" stroke="#bdcad8"/><g><rect x="60" y="252" width="240" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="61" y="270" width="4" height="34" fill="#2261bd"/><text x="80" y="290" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">研究问题</text><text x="80" y="322" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">对象、级段、比较条件</text><text x="80" y="367" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">课程要求 → 研究契约</text></g><polyline points="300,310 324,310" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-01)"/><g><rect x="324" y="252" width="240" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="325" y="270" width="4" height="34" fill="#2261bd"/><text x="344" y="290" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">证据与参数</text><text x="344" y="322" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">版本、单位、系统边界</text><text x="344" y="367" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">已积累资料 · 继续核验</text></g><polyline points="564,310 588,310" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-01)"/><g><rect x="588" y="252" width="240" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="589" y="270" width="4" height="34" fill="#2261bd"/><text x="608" y="290" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">模型与算例</text><text x="608" y="322" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">假设、输入、独立基准</text><text x="608" y="367" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">气相方法基准已固定</text></g><polyline points="828,310 852,310" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-01)"/><g><rect x="852" y="252" width="240" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="853" y="270" width="4" height="34" fill="#2261bd"/><text x="872" y="290" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">C17 计算</text><text x="872" y="322" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">纯核心、显式状态</text><text x="872" y="367" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">燃烧 / 喷管 / 外排支路</text></g><polyline points="1092,310 1116,310" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-01)"/><g><rect x="1116" y="252" width="240" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="1117" y="270" width="4" height="34" fill="#2261bd"/><text x="1136" y="290" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">验证与研究</text><text x="1136" y="322" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">误差、敏感性、改进</text><text x="1136" y="367" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">基础验证已有 · 研究待深化</text></g><polyline points="1356,310 1380,310" fill="none" stroke="#2261bd" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-01)"/><g><rect x="1380" y="252" width="240" height="132" rx="9" fill="#ffffff" stroke="#2261bd" stroke-width="1.5"/><rect x="1381" y="270" width="4" height="34" fill="#2261bd"/><text x="1400" y="290" font-size="23" fill="#15263c" font-weight="650" text-anchor="start">可复现交付</text><text x="1400" y="322" font-size="18" fill="#52667c" font-weight="400" text-anchor="start">程序、报告、展示</text><text x="1400" y="367" font-size="14" fill="#2261bd" font-weight="600" text-anchor="start">输入、结果与版本一致</text></g><polyline points="1236,384 1236,440 444,440 444,384" fill="none" stroke="#52667c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-01)" stroke-dasharray="6 5"/><text x="840" y="429" font-size="16" fill="#52667c" font-weight="400" text-anchor="middle">证据不足 / 误差未解释：回到参数和模型</text><text x="60" y="509" font-size="22" fill="#15263c" font-weight="650" text-anchor="start">三类资料始终分开</text><text x="60" y="555" font-size="21" fill="#087f78" font-weight="650" text-anchor="start">事实</text><text x="60" y="589" font-size="19" fill="#52667c" font-weight="400" text-anchor="start">原文、日期、子型与工况</text><text x="600" y="555" font-size="21" fill="#087f78" font-weight="650" text-anchor="start">假设 / 派生量</text><text x="600" y="589" font-size="19" fill="#52667c" font-weight="400" text-anchor="start">过程可解释，不冒充实测</text><text x="1140" y="555" font-size="21" fill="#087f78" font-weight="650" text-anchor="start">计算结果</text><text x="1140" y="589" font-size="19" fill="#52667c" font-weight="400" text-anchor="start">关联输入、代码与验证记录</text><line x1="60" y1="646" x2="1620" y2="646" stroke="#bdcad8"/><text x="60" y="680" font-size="16" fill="#52667c" font-weight="400" text-anchor="start">输入来源、计算条件与验证记录分别保留</text><text x="1620" y="680" font-size="15" fill="#52667c" font-weight="400" text-anchor="end">SVG / Mermaid 可编辑源 · 由项目登记生成</text></g></svg>
