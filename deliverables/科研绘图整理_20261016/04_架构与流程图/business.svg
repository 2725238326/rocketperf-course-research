<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="business-title business-desc"><title id="business-title">业务层次</title><desc id="business-desc">应用层（单点求解、域评估、参数研究）组合调用领域层的热化学、喷管、循环模型；领域层共用数值核心、物性数据与错误契约。</desc><defs><marker id="ah-main" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/></marker><marker id="ah-sub" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/></marker><marker id="ah-call" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#9aa1ab"/></marker><marker id="ah-loop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a06d00"/></marker><marker id="ah-verify" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7b1fa2"/></marker><marker id="ah-fail" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#c62828"/></marker></defs><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><rect width="1280" height="680" fill="#ffffff"/><text x="40" y="46" font-size="22" fill="#1f2328" font-weight="700" text-anchor="start">业务层次</text><text x="40" y="70" font-size="12" fill="#5f6670" text-anchor="start">应用层按用例组合调用领域模型，领域模型共用基础设施；箭头为调用方向</text><line x1="40" y1="86" x2="1240" y2="86" stroke="#e1e4e8" stroke-width="1"/><rect x="60" y="104" width="1160" height="130" rx="8" fill="#f6f7f9" stroke="#e1e4e8" stroke-width="1"/><text x="74" y="126" font-size="13" fill="#0277bd" font-weight="700" text-anchor="start">应用层</text><rect x="84" y="132" width="336" height="86" rx="8" fill="#ffffff" stroke="#0277bd" stroke-width="1.5"/><text x="100" y="160" font-size="16" fill="#0277bd" font-weight="700" text-anchor="start">单点性能求解</text><text x="406" y="159" font-size="10" fill="#5f6670" text-anchor="end" font-family="'Cascadia Mono',Consolas,'JetBrains Mono',monospace">combustion · cycle</text><line x1="100" y1="172" x2="404" y2="172" stroke="#e5e7eb" stroke-width="1"/><text x="100" y="194" font-size="12" fill="#1f2328" text-anchor="start">给定推进剂、室压、面积比求 Isp</text><polyline points="252,218 252,252" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round"/><circle cx="252" cy="252" r="3" fill="#6b7280"/><rect x="472" y="132" width="336" height="86" rx="8" fill="#ffffff" stroke="#0277bd" stroke-width="1.5"/><text x="488" y="160" font-size="16" fill="#0277bd" font-weight="700" text-anchor="start">域评估</text><text x="794" y="159" font-size="10" fill="#5f6670" text-anchor="end" font-family="'Cascadia Mono',Consolas,'JetBrains Mono',monospace">nozzle regime</text><line x1="488" y1="172" x2="792" y2="172" stroke="#e5e7eb" stroke-width="1"/><text x="488" y="194" font-size="12" fill="#1f2328" text-anchor="start">判断匹配 / 过膨胀，不预测分离</text><polyline points="640,218 640,252" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round"/><circle cx="640" cy="252" r="3" fill="#6b7280"/><rect x="860" y="132" width="336" height="86" rx="8" fill="#ffffff" stroke="#0277bd" stroke-width="1.5"/><text x="876" y="160" font-size="16" fill="#0277bd" font-weight="700" text-anchor="start">参数研究</text><text x="1182" y="159" font-size="10" fill="#5f6670" text-anchor="end" font-family="'Cascadia Mono',Consolas,'JetBrains Mono',monospace">study</text><line x1="876" y1="172" x2="1180" y2="172" stroke="#e5e7eb" stroke-width="1"/><text x="876" y="194" font-size="12" fill="#1f2328" text-anchor="start">面积比 × 背压扫描，推进剂成对比较</text><polyline points="1028,218 1028,252" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round"/><circle cx="1028" cy="252" r="3" fill="#6b7280"/><line x1="252" y1="252" x2="1028" y2="252" stroke="#6b7280" stroke-width="1"/><rect x="60" y="266" width="1160" height="214" rx="8" fill="#f6f7f9" stroke="#e1e4e8" stroke-width="1"/><text x="74" y="288" font-size="13" fill="#d35400" font-weight="700" text-anchor="start">领域层</text><polyline points="252,252 252,294" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-main)"/><rect x="84" y="294" width="336" height="110" rx="8" fill="#ffffff" stroke="#d35400" stroke-width="1.5"/><text x="100" y="322" font-size="16" fill="#d35400" font-weight="700" text-anchor="start">thermo · 热化学</text><line x1="100" y1="334" x2="404" y2="334" stroke="#e5e7eb" stroke-width="1"/><text x="100" y="356" font-size="12" fill="#1f2328" text-anchor="start">燃烧产物是什么气体？</text><text x="100" y="390" font-size="10" fill="#5f6670" text-anchor="start">输出 Tc · 组分 · h</text><polyline points="640,252 640,294" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-main)"/><rect x="472" y="294" width="336" height="110" rx="8" fill="#ffffff" stroke="#d35400" stroke-width="1.5"/><text x="488" y="322" font-size="16" fill="#d35400" font-weight="700" text-anchor="start">nozzle · 喷管</text><line x1="488" y1="334" x2="792" y2="334" stroke="#e5e7eb" stroke-width="1"/><text x="488" y="356" font-size="12" fill="#1f2328" text-anchor="start">膨胀能产生多少推力？</text><text x="488" y="390" font-size="10" fill="#5f6670" text-anchor="start">输出 流量 · c* · CF · Isp</text><polyline points="1028,252 1028,294" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-main)"/><rect x="860" y="294" width="336" height="110" rx="8" fill="#ffffff" stroke="#a06d00" stroke-width="1.5" stroke-dasharray="5 4"/><text x="876" y="322" font-size="16" fill="#a06d00" font-weight="700" text-anchor="start">cycle · 循环</text><line x1="876" y1="334" x2="1180" y2="334" stroke="#e5e7eb" stroke-width="1"/><text x="876" y="356" font-size="12" fill="#1f2328" text-anchor="start">泵与涡轮