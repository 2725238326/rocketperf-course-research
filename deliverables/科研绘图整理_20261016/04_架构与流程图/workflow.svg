<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="workflow-title workflow-desc"><title id="workflow-title">工作流程</title><desc id="workflow-desc">用户输入、INI 解析、HP 平衡、喷管计算、循环闭合、结果输出、核验七步；每步列出产物、负责模块与失败处理，核验偏差回到输入。</desc><defs><marker id="ah-main" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/></marker><marker id="ah-sub" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/></marker><marker id="ah-call" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#9aa1ab"/></marker><marker id="ah-loop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a06d00"/></marker><marker id="ah-verify" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7b1fa2"/></marker><marker id="ah-fail" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#c62828"/></marker></defs><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif"><rect width="1280" height="520" fill="#ffffff"/><text x="40" y="46" font-size="22" fill="#1f2328" font-weight="700" text-anchor="start">工作流程</text><text x="40" y="70" font-size="12" fill="#5f6670" text-anchor="start">每步的产物、负责模块与失败处理</text><line x1="40" y1="86" x2="1240" y2="86" stroke="#e1e4e8" stroke-width="1"/><rect x="120" y="130" width="140" height="104" rx="8" fill="#ffffff" stroke="#0277bd" stroke-width="1.5"/><text x="132" y="152" font-size="10" fill="#0277bd" font-weight="700" text-anchor="start" font-family="'Cascadia Mono',Consolas,'JetBrains Mono',monospace">01</text><text x="156" y="153" font-size="14" f