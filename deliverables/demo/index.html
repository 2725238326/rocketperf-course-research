/* Categorical strip of log10(|diff|/tolerance); one column per group. */
function stripChart(api, spec) {
  const m = { l: 46, r: 12, t: 22, b: 36 }, pw = api.w - m.l - m.r, ph = api.h - m.t - m.b, lo = -6, hi = 0.35;

    s += el("line", { x1: m.l, x2: m.l + pw, y1: Y(e), y2: Y(e), stroke: "#EEF1F5" });
    s += el("text", { x: m.l - 7, y: Y(e) + 4, "text-anchor": "end", "font-size": 11.5, fill: "#7A8496" }, pow10Svg(e));

  s += el("line", { x1: m.l, x2: m.l + pw, y1: Y(0), y2: Y(0), stroke: "#B3261E", "stroke-width": 1.6 });
  s += el("text", { x: m.l + pw - 6, y: Y(0) - 6, "text-anchor": "end", "font-size": 11.5, fill: "#B3261E" }, "容差 = 1");
  s += el("text", { x: m.l, y: 13, "font-size": 11.5, fill: "#485266" }, "|C − CEA| / 容差");
  const dots = [];
  spec.groups.forEach((g, gi) => {
    const cx = m.l + cw * (gi + 0.5);
    g.points.forEach((p, i) => {
      const x = cx + ((i * 0.6180339887) % 1 - 0.5) * cw * 0.6 + (p.fuel === "rp1" ? cw * 0.05 : -cw * 0.05), y = Y(p.lq);

    });

  });
  api.content.innerHTML = s;
  api.hit.setAttribute("x", m.l); api.hit.setAttribute("y", m.t); api.hit.setAttribute("width", pw); api.hit.setAttribute("height", ph);
  api.state = {
    move(px, py, e) {
      let best = null, bd = 100;
      for (const d of dots) { const dd = (d.x - px) ** 2 + (d.y - py) ** 2; if (dd < bd) { bd = dd; best = d; } }
      if (!best) { api.hover.innerHTML = ""; hideTip(); return; }
      api.hover.innerHTML = el("circle", { cx: best.x, cy: best.y, r: 6, fill: "none", stroke: "#1A2233", "stroke-width": 1.6 });

    },
    pick: null,
  };
}

/* Pipe with a white casing so a later pipe visibly passes over an earlier one. */

/* ---- schematic_cycle.js ---- */
/* Cycle schematic on a fixed 1000×720 canvas. Positions were laid out so labels sit
 * in free space; staged combustion has one unavoidable crossing, drawn as an over-pass. */
const PX_PER_M = 350;
function cycleSchematic(c) {
  const gg = !c.inputs.staged_combustion, rp1 = c.feed === "rp1_assigned", B = c.balance, fuelC = rp1 ? COL.rp1 : COL.ch4;
  const vf = B.fuel_mass_flow_kg_per_s / c.density.fuel, vo = B.oxidizer_mass_flow_kg_per_s / c.density.oxidizer;
  const hMax = 270, hf = clamp(hMax * Math.min(1, vf / Math.max(vf, vo)), 196, hMax), ho = clamp(hMax * Math.min(1, vo / Math.max(vf, vo)), 196, hMax);
  const bottom = 290, fuelName = rp1 ? "RP-1" : "液甲烷", fuelT = rp1 ? "298 K" : `${c.inputs.fuel_temperature_k} K`;
  const rt = Math.sqrt(B.main_throat_area_m2 / Math.PI) * PX_PER_M, re = rt * Math.sqrt(c.inputs.main_area_ratio), rc = rt * Math.sqrt(3.2);
  let s = schematicDefs();
  const tanks = tank({ x: 40, y: bottom - ho, w: 104, h: ho, key: "ox_tank", fluid: "lox", name: "液氧箱",
      lines: [rp1 ? "90.17 K" : `${c.inputs.oxidizer_temperature_k} K`, `${fx(vo * 1000, 0)} L/s`] }) +
    tank({ x: 200, y: bottom - hf, w: 100, h: hf, key: "fuel_tank", fluid: rp1 ? "rp1" : "ch4", name: "燃料箱",
      lines: [`${fuelName}`, `${fuelT} · ${fx(vf * 1000, 0)} L/s`] });
  const eng = engine({ cx: 820, top: 130, lc: 92, rc, rt, re, ln: re * 1.55, plume: 118, pe: c.nozzle.pe, pa: c.inputs.ambient_pressure_pa, key: "engine",
    lines: ["主燃烧室", `${fx(c.chamber.t, 0)} K`, `${fx(c.inputs.chamber_pressure_pa / 1e6, 0)} MPa`] });
  // pipes underneath components, in drawing order (later pipes pass over earlier ones)
  let pipes = "";
  pipes += pipe([[250, bottom + 8], [250, 320], [436, 320]], fuelC, B.fuel_mass_flow_kg_per_s);

/* Tab: one liquid CH4 chamber, varying nozzle area ratio and back pressure. */
function nozzleSketch(ar, pe, pa, refused) {
  const W = 260, H = 250, cx = W / 2, rt = 12, re = rt * Math.sqrt(ar), rc = 34, top = 18, yt = 74, ye = yt + 14 + 10.5 * Math.sqrt(ar);
  const wall = `M${cx - rc},${top}H${cx + rc}V${top + 26}C${cx + rc},${yt - 18} ${cx + rt * 1.1},${yt - 8} ${cx + rt},${yt}` +
    `C${cx + rt * 1.9},${yt + (ye - yt) * 0.25} ${cx + re * 0.96},${ye - (ye - yt) * 0.4} ${cx + re},${ye}H${cx - re}` +
    `C${cx - re * 0.96},${ye - (ye - yt) * 0.4} ${cx - rt * 1.9},${yt + (ye - yt) * 0.25} ${cx - rt},${yt}C${cx - rt * 1.1},${yt - 8} ${cx - rc},${yt - 18} ${cx - rc},${top + 26}Z`;
  let plume = "";
  if (!refused) {
    const ratio = pa > 0 ? pe / pa : 8, spread = clamp(Math.log(ratio + 1) * 0.55, 0.15, 1.3), len = H - ye - 8;
    const w = re * (1 + spread * 0.5), neck = re * (pa > 0 && ratio < 1.6 ? 0.7 : 0.9);
    plume = `<path class="flicker" d="M${cx - re},${ye}C${cx - w},${ye + len * 0.35} ${cx - neck},${ye + len * 0.75} ${cx - neck * 0.6},${ye + len}H${cx + neck * 0.6}C${cx + neck},${ye + len * 0.75} ${cx + w},${ye + len * 0.35} ${cx + re},${ye}Z" fill="url(#g-plume)"/>`;
    if (pa > 0) for (let i = 0; i < 3; i++) { const yy = ye + len * (0.22 + 0.26 * i), ww = re * (0.5 - 0.1 * i);
      plume += el("path", { d: `M${cx},${yy - 10}L${cx + ww},${yy}L${cx},${yy + 10}L${cx - ww},${yy}Z`, fill: "#FFF7E0", opacity: 0.7 - 0.15 * i }); }
  } else {
    plume = el("path", { d: `M${cx - re},${ye + 6}L${cx + re},${H - 12}M${cx + re},${ye + 6}L${cx - re},${H - 12}`, stroke: "#B3261E", "stroke-width": 3, opacity: 0.7 }) +
      el("text", { x: cx, y: H - 2, "text-anchor": "middle", "font-size": 12, fill: "#B3261E", "font-weight": 650 }, "pa > pe · 模型域外");
  }
  return `<svg class="schematic" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${schematicDefs()}${plume}` +
    el("path", { d: wall, fill: "url(#g-copper)", stroke: "#5A3520", "stroke-width": 1.4 }) +
    el("line", { x1: cx - rt, x2: cx + rt, y1: yt, y2: yt, stroke: "#fff", "stroke-dasharray": "3 3" }) +
    el("text", { x: cx + rc + 8, y: top + 20, "font-size": 12, fill: "#485266" }, "燃烧室") +
    el("text", { x: cx + rt + 8, y: yt + 4, "font-size": 12, fill: "#485266" }, "喉部") +
    el("text", { x: cx + re + 6, y: ye - 4, "font-size": 12, fill: "#485266" }, `ε = ${ar}`) + "</svg>";
}

/* ---- main.js ---- */
/* Tabs, keyboard shortcuts, motion toggle and provenance footer. */
(function main() {
  const nav = $("tabs"), buttons = [];
  TABS.forEach((t, i) => {
    t.init();
    const b = h("button", "", `<kbd>${i + 1}</kbd>${t.title}`);
    b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("aria-controls", `v-${t.id}`);
    b.addEventListener("click", () => select(i));
    b.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); select((i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length, true); }
    });
    nav.append(b); buttons.push(b);
  });
  function select(i, focus) {
    TABS.forEach((t, j) => {
      const on = i === j;
      buttons[j].setAttribute("aria-selected", String(on)); buttons[j].tabIndex = on ? 0 : -1;
      $(`v-${t.id}`).hidden = !on;
    });
    hideTip();
    if (focus) buttons[i].focus();
    history.replaceState(null, "", `#${TABS[i].id}`);
  }
  const motion = $("motion");
  const setMotion = (on) => { motion.setAttribute("aria-pressed", String(on)); document.body.classList.toggle("still", !on); };
  motion.addEventListener("click", () => setMotion(motion.getAttribute("aria-pressed") !== "true"));
  if (REDUCED) setMotion(false);
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey) return;
    const n = "123456".indexOf(e.key);
    if (n >= 0 && n < TABS.length) select(n);
    if (e.key === "a" || e.key === "A") motion.click();
  });
  const pv = DATA.provenance;
  $("prov").innerHTML = `数据：rocketperf.exe（Release，已测）SHA-256 <code>${pv.binary_sha256.slice(0, 12)}</code> · ${fx(pv.c_runs, 0)} 次 C 运行 · ` +
    `生成 ${pv.generated_at.slice(0, 16).replace("T", " ")} UTC · 提交 <code>${pv.git_head}</code>`;
  const start = TABS.findIndex((t) => `#${t.id}` === location.hash);
  select(start >= 0 ? start : 0);
})();
